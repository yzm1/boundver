schema_version = 1
index_url = "https://pypi.org/simple"

# This manifest is the human-reviewed source of truth for automation tooling.
# CI and release independently include the public Action runtime, keeping the
# release environment free of unrelated lint and pre-commit tools. Every
# requirement is exact; platform markers are deliberately
# limited to packages whose upstream dependency metadata is platform-specific.

[profiles.action]
lock = "scripts/requirements/action.lock"
includes = []
requirements = [
  "attrs==25.4.0",
  "jsonschema==4.25.1",
  "jsonschema-specifications==2025.9.1",
  "packaging==26.3",
  "pip==25.3",
  "PyYAML==6.0.3",
  "referencing==0.36.2",
  "rpds-py==0.27.1",
  "setuptools==80.9.0",
  "tomli==2.4.1; python_version < '3.11'",
  "typing-extensions==4.15.0",
  "wheel==0.48.0",
]

[profiles.ci]
lock = "scripts/requirements/ci.lock"
includes = ["action"]
requirements = [
  "build==1.4.4",
  "cfgv==3.4.0",
  "colorama==0.4.6; sys_platform == 'win32'",
  "distlib==0.4.3",
