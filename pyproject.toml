[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boundver"
version = "0.1.0"
description = "Semantic boundary/version lockfile generator for multi-component repositories"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "boundver contributors" }]
dependencies = []

[project.optional-dependencies]
schema = ["jsonschema>=4"]
yaml = ["PyYAML>=6"]
dev = ["pytest>=7,<9", "jsonschema>=4", "build>=1.2", "PyYAML>=6"]

[project.scripts]
boundver = "boundver.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
