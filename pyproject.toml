[build-system]
requires = ["setuptools==84.0.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "boundver"
version = "0.14.1"
description = "Classify contract drift and downstream impact across polyglot repositories"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "boundver contributors" }]
keywords = [
  "api-contract",
  "api-compatibility",
  "breaking-changes",
  "change-detection",
  "ci",
  "contract-testing",
  "developer-tools",
  "git",
  "lockfile",
  "monorepo",
  "openapi",
  "polyglot",
  "semantic-versioning",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
  "Topic :: Software Development :: Build Tools",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Version Control :: Git",
]
dependencies = ["tomli>=2.0; python_version < '3.11'"]

[project.urls]
Homepage = "https://github.com/yzm1/boundver"
Documentation = "https://yzm1.github.io/boundver/"
Changelog = "https://github.com/yzm1/boundver/blob/main/CHANGELOG.md"
Issues = "https://github.com/yzm1/boundver/issues"
Repository = "https://github.com/yzm1/boundver"
Community = "https://github.com/yzm1/boundver/discussions/100"
"GitHub Action" = "https://github.com/marketplace/actions/boundver"
Container = "https://github.com/yzm1/boundver/pkgs/container/boundver"
Homebrew = "https://github.com/yzm1/homebrew-boundver"
"GitLab CI/CD Catalog" = "https://gitlab.com/boundver-project/boundver"

[project.optional-dependencies]
schema = ["jsonschema>=4.18"]
yaml = ["PyYAML>=6"]
dev = [
  "coverage==7.10.7",
  "pytest>=9,<10",
  "jsonschema>=4.18",
  "build>=1.2",
  "PyYAML>=6",
  "ruff==0.16.3",
]

[project.scripts]
boundver = "boundver.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
boundver = ["py.typed", "boundary.config.schema.json"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["F"]
