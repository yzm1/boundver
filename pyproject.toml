[build-system]
requires = ["setuptools>=78.1.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boundver"
version = "0.10.0"
description = "Detect API boundary, behavioral contract, and component changes in CI"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "boundver contributors" }]
keywords = [
  "api-contract",
  "api-compatibility",
  "breaking-changes",
  "change-detection",
  "ci",
  "contract-testing",
  "developer-tools",
  "git",
  "lockfile",
  "monorepo",
  "openapi",
  "polyglot",
  "semantic-versioning",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
  "Topic :: Software Development :: Build Tools",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Version Control :: Git",
]
dependencies = ["tomli>=2.0; python_version < '3.11'"]

[project.urls]
Homepage = "https://github.com/yzm1/boundver"
Documentation = "https://github.com/yzm1/boundver/tree/main/docs"
Changelog = "https://github.com/yzm1/boundver/blob/main/CHANGELOG.md"
Issues = "https://github.com/yzm1/boundver/issues"
Repository = "https://github.com/yzm1/boundver"
"GitHub Action" = "https://github.com/marketplace/actions/boundver"

[project.optional-dependencies]
schema = ["jsonschema>=4"]
yaml = ["PyYAML>=6"]
dev = ["pytest>=7,<9", "jsonschema>=4", "build>=1.2", "PyYAML>=6"]

[project.scripts]
boundver = "boundver.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
boundver = ["py.typed", "boundary.config.schema.json"]

[tool.setuptools.packages.find]
where = ["src"]
