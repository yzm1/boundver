<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-labelledby="title desc">
  <title id="title">Boundver grayscale validation</title>
  <desc id="desc">The canonical logo rendered in grayscale on light and dark backgrounds.</desc>
  <defs>
    <filter id="grayscale">
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>
  <rect width="500" height="500" fill="#ffffff"/>
  <rect x="500" width="500" height="500" fill="#161c37"/>
  <text x="28" y="44" fill="#111936" font-family="Segoe UI, system-ui, sans-serif" font-size="22" font-weight="600">Grayscale · light</text>
  <text x="528" y="44" fill="#ffffff" font-family="Segoe UI, system-ui, sans-serif" font-size="22" font-weight="600">Grayscale · dark</text>
  <image href="../logo.svg" x="110" y="70" width="280" height="280" filter="url(#grayscale)"/>
  <image href="../logo.svg" x="610" y="70" width="280" height="280" filter="url(#grayscale)"/>
  <text x="250" y="420" fill="#111936" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="18">Geometry—not color—separates the event</text>
  <text x="750" y="420" fill="#ffffff" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="18">Geometry—not color—separates the event</text>
</svg>
