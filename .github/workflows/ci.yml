name: Native ARM curl-free candidate audit
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v017-native-arm-curlfree-audit
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    env:
      SOURCE_SHA: 3d05d26f1c90605ee9a6a360d6eefb34adba063c
      TRIVY_IMAGE: ghcr.io/aquasecurity/trivy@sha256:7cced7cae583819fc7806d4cbc0dbbc7cad18b99f7d3e235192e6da8c091045c
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        timeout-minutes: 1
        with:
          ref: 3d05d26f1c90605ee9a6a360d6eefb34adba063c
          persist-credentials: false
      - name: Verify exact source and native architecture
        timeout-minutes: 1
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(uname -m)" = aarch64
          mkdir -p "$RUNNER_TEMP/arm-audit/reports" "$RUNNER_TEMP/arm-audit/cache"
          printf '%s\n' "$SOURCE_SHA" > "$RUNNER_TEMP/arm-audit/reports/source-sha.txt"
      - name: Build exact candidate without publishing
        timeout-minutes: 12
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=15s 660 docker build \
            --platform linux/arm64 --progress plain \
            --build-arg BOUNDVER_VERSION=0.17.0 --build-arg BOUNDVER_REVISION="$SOURCE_SHA" \
            --tag boundver-arm-audit:candidate . 2>&1 | tee "$RUNNER_TEMP/arm-audit/reports/build.log"
          docker image inspect boundver-arm-audit:candidate > "$RUNNER_TEMP/arm-audit/reports/image-inspect.json"
          test "$(docker image inspect --format '{{.Architecture}}' boundver-arm-audit:candidate)" = arm64
          test "$(docker image inspect --format '{{.Config.User}}' boundver-arm-audit:candidate)" = boundver
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' boundver-arm-audit:candidate)" = "$SOURCE_SHA"
          docker image save --output "$RUNNER_TEMP/arm-audit/image.tar" boundver-arm-audit:candidate
          sha256sum "$RUNNER_TEMP/arm-audit/image.tar" > "$RUNNER_TEMP/arm-audit/reports/archive-sha256.txt"
      - name: Non-root offline read-only smoke and source bundle
        timeout-minutes: 1
        run: |
          set -euo pipefail
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges boundver-arm-audit:candidate --version
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --volume "$PWD:/repo:ro" \
            boundver-arm-audit:candidate verify --source head
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --entrypoint /bin/sh boundver-arm-audit:candidate -eu -c '
              test "$(id -u)" = 1000
              test -s /usr/share/licenses/git/COPYING
              test -s /usr/share/doc/git/copyright
              cd /usr/share/licenses/git/source
              sha256sum -c SHA256SUMS
              for package in libcurl3t64-gnutls libgssapi-krb5-2 libkrb5-3 libk5crypto3 libkrb5support0 libexpat1 perl perl-modules-5.40; do
                status=$(dpkg-query -W -f="\${db:Status-Status}" "$package" 2>/dev/null || true)
                test "$status" != installed
              done
              for library in /usr/lib/*/libkrb5*.so* /usr/lib/*/libgssapi*.so* /usr/lib/*/libgssrpc*.so* /usr/lib/*/libk5crypto*.so* /usr/lib/*/libcurl*.so*; do
                test ! -e "$library" && test ! -L "$library"
              done
              git_exec_path=$(git --exec-path)
              for helper in git-remote-http git-remote-https git-http-fetch git-http-push; do
                test ! -e "$git_exec_path/$helper"
              done
            '
      - name: Download pinned scanner and current database
        timeout-minutes: 2
        run: |
          set -euo pipefail
          docker pull "$TRIVY_IMAGE"
          docker run --rm --volume "$RUNNER_TEMP/arm-audit/cache:/cache" "$TRIVY_IMAGE" \
            image --cache-dir /cache --download-db-only
          cp "$RUNNER_TEMP/arm-audit/cache/db/metadata.json" "$RUNNER_TEMP/arm-audit/reports/db-metadata.json"
      - name: Raw inventory plus scoped and independent fixable gates
        timeout-minutes: 5
        run: |
          set -euo pipefail
          scan=(docker run --rm --network none
            --volume "$RUNNER_TEMP/arm-audit/image.tar:/audit/image.tar:ro"
            --volume "$RUNNER_TEMP/arm-audit/cache:/cache"
            --volume "$RUNNER_TEMP/arm-audit/reports:/reports"
            --volume "$PWD/.trivyignore.yaml:/policy.yaml:ro" "$TRIVY_IMAGE"
            image --cache-dir /cache --skip-db-update --skip-java-db-update
            --scanners vuln --severity HIGH,CRITICAL --format json --input /audit/image.tar --timeout 75s)
          timeout --signal=TERM --kill-after=10s 90 "${scan[@]}" --output /reports/raw.json --exit-code 0
          timeout --signal=TERM --kill-after=10s 90 "${scan[@]}" --output /reports/policy.json --ignorefile /policy.yaml --exit-code 1
          # The separate fixable scan deliberately receives no ignorefile.
          timeout --signal=TERM --kill-after=10s 90 "${scan[@]}" --output /reports/fixable.json --ignore-unfixed --exit-code 1
          sha256sum -c "$RUNNER_TEMP/arm-audit/reports/archive-sha256.txt"
      - name: Retain bounded reports, not image archives
        timeout-minutes: 2
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: v017-native-arm-curlfree-audit
          path: ${{ runner.temp }}/arm-audit/reports/
          retention-days: 3
          if-no-files-found: warn
