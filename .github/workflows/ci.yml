name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run tests
        run: pytest -v --tb=long --junit-xml=pytest_results.xml

      - name: Print failures
        if: failure()
        shell: python
        run: |
          import xml.etree.ElementTree as ET, sys
          try:
            tree = ET.parse("pytest_results.xml")
            root = tree.getroot()
            failed = []
            for tc in root.iter("testcase"):
              for child in tc:
                if child.tag in ("failure", "error"):
                  name = tc.attrib.get('name', '?')
                  msg = child.attrib.get("message", "")[:300]
                  body = (child.text or "")[:500]
                  failed.append(name)
                  print(f"::error title={name}::{msg}")
                  print(f"FAIL: {name}", flush=True)
                  print(msg, flush=True)
                  print(body, flush=True)
                  print("---")
            print(f"\nTotal failures: {len(failed)}", flush=True)
          except Exception as e:
            print(f"::error title=ParseError::Could not parse XML: {e}", flush=True)

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results-${{ matrix.os }}-py${{ matrix.python-version }}
          path: pytest_results.xml

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build package
        run: |
          python -m pip install --upgrade pip
          bash scripts/packaging_smoke.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  action:
    name: Public Action contract
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify with the public interface
        uses: ./
        with:
          facets: boundary,compat

      - name: Exercise hostile input as data
        id: hostile
        continue-on-error: true
        uses: ./
        with:
          components: 'boundver; touch /tmp/boundver-action-injected'

      - name: Confirm input was not executed
        shell: bash
        run: test ! -e /tmp/boundver-action-injected
