name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: macos-15-intel
            python-version: "3.12"
          - os: macos-15
            python-version: "3.12"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Reject automation dependencies with current PyPI advisories
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: python -I scripts/lock_release_tools.py check

      - name: Install dev dependencies
        run: |
          python -I scripts/install_locked_tools.py ci
          python -I -m pip --isolated install --no-index --no-deps --no-build-isolation -e .

      - name: Verify automation dependency locks
        run: python -I scripts/lock_release_tools.py verify

      - name: Reject undefined names and unused code
        run: python -I -m ruff check src tests scripts

      - name: Run tests
        run: python -I -m pytest -v --tb=long --junit-xml=pytest_results.xml

      - name: Enforce semantic-provider gate branch coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: |
          python -I -m coverage erase
          python -I -m coverage run --branch -m pytest -q tests/test_semantic_provider_proposal.py
          python -I -m coverage report --include="scripts/audit_semantic_provider_proposal.py,scripts/check_semantic_provider_proposal.py" --fail-under=75

      - name: Enforce intrinsic runtime contract
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: >-
          python -I scripts/benchmark_runtime.py --runs 3 --enforce
          --output runtime_benchmark.json

      - name: Print failures
        if: failure()
        run: python -I scripts/report_pytest_failures.py pytest_results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pytest-results-${{ matrix.os }}-py${{ matrix.python-version }}
          path: |
            pytest_results.xml
            runtime_benchmark.json

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Validate semantic-provider proposal gate
        run: python -I scripts/check_semantic_provider_proposal.py

      - name: Build package
        env:
          BASH_ENV: ""
          CDPATH: ""
          ENV: ""
          GLOBIGNORE: ""
        run: |
          python -I scripts/check_repo_hygiene.py
          SOURCE_DATE_EPOCH=$(git show -s --format=%ct "$GITHUB_SHA") \
            bash scripts/packaging_smoke.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  action:
    name: Public Action contract (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"
          - os: macos-15
            python-version: "3.12"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify with the public interface
        id: boundver
        uses: ./
        with:
          python-version: ${{ matrix.python-version }}

      - name: Check bounded Action outputs
        shell: bash
        env:
          BOUNDVER_CONSUMER_IMPACT: ${{ steps.boundver.outputs.consumer-impact }}
          BOUNDVER_TRUNCATED_OUTPUTS: ${{ steps.boundver.outputs.truncated-outputs }}
          BOUNDVER_RESULT_FILE: ${{ steps.boundver.outputs.result-file }}
        run: |
          python -I - <<'PY'
          import json
          import os
          from pathlib import Path

          assert json.loads(os.environ["BOUNDVER_CONSUMER_IMPACT"]) == []
          assert json.loads(os.environ["BOUNDVER_TRUNCATED_OUTPUTS"]) == []
          result = Path(os.environ["BOUNDVER_RESULT_FILE"])
          assert result.is_file()
          assert json.loads(result.read_text(encoding="utf-8"))["ok"] is True
          PY

      - name: Review an immutable range with the public interface
        id: boundver-review
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: ./
        with:
          operation: review
          base: HEAD^
          target: HEAD
          transitive: true
          python-version: ${{ matrix.python-version }}

      - name: Check CI-native review outputs
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        shell: bash
        env:
          BOUNDVER_RESULT_SCHEMA: ${{ steps.boundver-review.outputs.result-schema }}
          BOUNDVER_TRANSPORT_COMPLETE: ${{ steps.boundver-review.outputs.transport-complete }}
          BOUNDVER_SELECTION_COMPLETE: ${{ steps.boundver-review.outputs.selection-complete }}
          BOUNDVER_CHANGED_COMPONENTS: ${{ steps.boundver-review.outputs.changed-components }}
          BOUNDVER_TEST_COMPONENTS: ${{ steps.boundver-review.outputs.test-components }}
          BOUNDVER_TRUNCATED_OUTPUTS: ${{ steps.boundver-review.outputs.truncated-outputs }}
          BOUNDVER_RESULT_FILE: ${{ steps.boundver-review.outputs.result-file }}
          BOUNDVER_SUMMARY_FILE: ${{ steps.boundver-review.outputs.summary-file }}
        run: |
          python -I - <<'PY'
          import json
          import os
          from pathlib import Path

          assert os.environ["BOUNDVER_RESULT_SCHEMA"] == "boundver-plan/v1"
          assert os.environ["BOUNDVER_TRANSPORT_COMPLETE"] == "true"
          assert os.environ["BOUNDVER_SELECTION_COMPLETE"] == "true"
          changed = json.loads(os.environ["BOUNDVER_CHANGED_COMPONENTS"])
          selected = json.loads(os.environ["BOUNDVER_TEST_COMPONENTS"])
          assert changed
          assert set(changed) <= set(selected)
          assert json.loads(os.environ["BOUNDVER_TRUNCATED_OUTPUTS"]) == []
          plan = json.loads(
              Path(os.environ["BOUNDVER_RESULT_FILE"]).read_text(encoding="utf-8")
          )
          assert plan["schema"] == "boundver-plan/v1"
          assert plan["complete"] is True
          assert plan["selection"]["changed_components"] == changed
          summary = Path(os.environ["BOUNDVER_SUMMARY_FILE"]).read_text(
              encoding="utf-8"
          )
          assert "Routing evidence only" in summary
          assert "Presentation complete" in summary
          PY

      - name: Exercise pre-JSON Action failure
        id: boundver-pre-json-failure
        continue-on-error: true
        uses: ./
        with:
          python-version: ${{ matrix.python-version }}
          config: does-not-exist.json

      - name: Check incomplete Action outputs
        shell: bash
        env:
          BOUNDVER_ISSUES: ${{ steps.boundver-pre-json-failure.outputs.issues }}
          BOUNDVER_CONSUMER_IMPACT: ${{ steps.boundver-pre-json-failure.outputs.consumer-impact }}
          BOUNDVER_TRUNCATED_OUTPUTS: ${{ steps.boundver-pre-json-failure.outputs.truncated-outputs }}
          BOUNDVER_RESULT_FILE: ${{ steps.boundver-pre-json-failure.outputs.result-file }}
        run: |
          python -I - <<'PY'
          import json
          import os
          from pathlib import Path

          expected = ["issues", "observations", "consumer-impact"]
          assert "result unavailable" in os.environ["BOUNDVER_ISSUES"]
          assert json.loads(os.environ["BOUNDVER_CONSUMER_IMPACT"]) == []
          assert json.loads(os.environ["BOUNDVER_TRUNCATED_OUTPUTS"]) == expected
          payload = json.loads(
              Path(os.environ["BOUNDVER_RESULT_FILE"]).read_text(encoding="utf-8")
          )
          assert payload["ok"] is False
          assert payload["action_transport"] == {
              "complete": False,
              "reason": "empty",
          }
          PY

      - name: Exercise hostile input as data
        continue-on-error: true
        uses: ./
        with:
          python-version: ${{ matrix.python-version }}
          components: 'boundver; touch /tmp/boundver-action-injected'

      - name: Confirm input was not executed
        shell: bash
        run: test ! -e /tmp/boundver-action-injected

  public-installations:
    name: Public installation contracts (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Exercise all published pre-commit hooks
        shell: bash
        run: |
          set -euo pipefail
          python -I scripts/install_locked_tools.py ci
          python -I -m pre_commit try-repo . boundver-verify --all-files
          python -I -m pre_commit try-repo . boundver-verify-push \
            --all-files --hook-stage pre-push
          python -I -m pre_commit try-repo . boundver-generate --all-files
          git diff --exit-code -- boundary.lock.json

      - name: Run the public consumer-impact demo
        if: matrix.os == 'ubuntu-latest'
        run: python -I scripts/demo_consumer_impact.py

      - name: Run the public historical range-review demo
        if: matrix.os == 'ubuntu-latest'
        run: python -I scripts/demo_range_review.py

      - name: Build and exercise the public Dockerfile
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -euo pipefail
          docker build --tag boundver-ci:${GITHUB_SHA} .
          docker run --rm \
            --network none \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            boundver-ci:${GITHUB_SHA} \
            --version
          docker run --rm \
            --network none \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --volume "$GITHUB_WORKSPACE:/repo:ro" \
            --workdir /repo \
            boundver-ci:${GITHUB_SHA} \
            verify --source head --facets exact

      - name: Reject high-severity repository and container risks
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        env:
          BASH_ENV: ""
          CDPATH: ""
          ENV: ""
          GLOBIGNORE: ""
          TRIVY_IMAGE: ghcr.io/aquasecurity/trivy@sha256:7cced7cae583819fc7806d4cbc0dbbc7cad18b99f7d3e235192e6da8c091045c
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/boundver-ci.tar"
          cache="$RUNNER_TEMP/trivy-cache"
          mkdir -m 700 "$cache"
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/workspace:ro" \
            --volume "$cache:/root/.cache" \
            "$TRIVY_IMAGE" fs \
            --scanners misconfig,secret \
            --severity HIGH,CRITICAL \
            --skip-dirs /workspace/.git \
            --no-progress \
            --skip-version-check \
            --exit-code 1 \
            /workspace
          docker save --output "$archive" "boundver-ci:${GITHUB_SHA}"
          scan=(
            docker run --rm
            --volume "$RUNNER_TEMP:/scan:ro"
            --volume "$GITHUB_WORKSPACE:/policy:ro"
            --volume "$cache:/root/.cache"
            "$TRIVY_IMAGE" image
            --input /scan/boundver-ci.tar
            --platform linux/amd64
            --scanners vuln
            --severity HIGH,CRITICAL
            --max-image-size 2GB
            --no-progress
            --skip-version-check
          )
          "${scan[@]}" --ignorefile /policy/.trivyignore.yaml --exit-code 1
          "${scan[@]}" --ignore-unfixed --exit-code 1
