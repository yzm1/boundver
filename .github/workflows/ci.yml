name: Native ARM v017 VEX audit
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v017-native-arm-vex-audit
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    env:
      SOURCE_SHA: 1f741b80a5117e3eef2335915369a80099b9b69f
      TRIVY_IMAGE: ghcr.io/aquasecurity/trivy@sha256:7cced7cae583819fc7806d4cbc0dbbc7cad18b99f7d3e235192e6da8c091045c
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 1f741b80a5117e3eef2335915369a80099b9b69f
          persist-credentials: false
      - name: Verify source and build without publishing
        timeout-minutes: 16
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(uname -m)" = aarch64
          reports="$RUNNER_TEMP/arm-vex/reports"
          mkdir -p "$reports" "$RUNNER_TEMP/arm-vex/cache"
          printf '%s\n' "$SOURCE_SHA" > "$reports/source-sha.txt"
          timeout --signal=TERM --kill-after=15s 900 docker build \
            --platform linux/arm64 --progress plain \
            --build-arg BOUNDVER_VERSION=0.17.0 --build-arg BOUNDVER_REVISION="$SOURCE_SHA" \
            --tag boundver-arm-vex:candidate . 2>&1 | tee "$reports/build.log"
          docker image inspect boundver-arm-vex:candidate > "$reports/image-inspect.json"
          docker image save --output "$RUNNER_TEMP/arm-vex/image.tar" boundver-arm-vex:candidate
          sha256sum "$RUNNER_TEMP/arm-vex/image.tar" > "$reports/archive-sha256.txt"
      - name: Exercise non-root offline image and source bundle
        timeout-minutes: 1
        run: |
          set -euo pipefail
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges boundver-arm-vex:candidate --version
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges \
            --volume "$PWD:/repo:ro" boundver-arm-vex:candidate verify --source head
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges \
            --entrypoint /bin/sh boundver-arm-vex:candidate -eu -c '
              test "$(id -u)" = 1000
              test "$(git --version)" = "git version 2.50.2"
              cd /usr/share/licenses/git/source
              sha256sum -c SHA256SUMS
            '
      - name: Download current database with pinned scanner
        timeout-minutes: 3
        run: |
          set -euo pipefail
          docker pull "$TRIVY_IMAGE"
          docker run --rm --volume "$RUNNER_TEMP/arm-vex/cache:/cache" "$TRIVY_IMAGE" image --cache-dir /cache --download-db-only
          cp "$RUNNER_TEMP/arm-vex/cache/db/metadata.json" "$RUNNER_TEMP/arm-vex/reports/db-metadata.json"
      - name: Raw and independent fixable scans, image-bound VEX, complete accounting
        timeout-minutes: 6
        run: |
          set -euo pipefail
          reports="$RUNNER_TEMP/arm-vex/reports"
          archive="$RUNNER_TEMP/arm-vex/image.tar"
          scan=(docker run --rm --network none
            --volume "$archive:/audit/image.tar:ro"
            --volume "$RUNNER_TEMP/arm-vex/cache:/cache"
            --volume "$reports:/reports"
            --volume "$PWD/.trivyignore.yaml:/policy.yaml:ro" "$TRIVY_IMAGE"
            image --cache-dir /cache --skip-db-update --skip-java-db-update --config /dev/null
            --scanners vuln --severity HIGH,CRITICAL --format json --input /audit/image.tar --timeout 75s)
          timeout --signal=TERM --kill-after=10s 90 "${scan[@]}" --output /reports/raw.json --show-suppressed --exit-code 0
          timeout --signal=TERM --kill-after=10s 90 "${scan[@]}" --output /reports/fixable.json --ignore-unfixed --exit-code 1
          python3 -I scripts/prepare_git_vex.py prepare --image "$archive" --raw-report "$reports/raw.json" \
            --source-root "$PWD" --release-sha "$SOURCE_SHA" --architecture arm64 --output "$reports/git-vex.json"
          timeout --signal=TERM --kill-after=10s 90 "${scan[@]}" --output /reports/scoped.json \
            --ignorefile /policy.yaml --vex /reports/git-vex.json --show-suppressed --exit-code 1
          python3 -I scripts/prepare_git_vex.py check --image "$archive" --raw-report "$reports/raw.json" \
            --scoped-report "$reports/scoped.json" --vex "$reports/git-vex.json"
          sha256sum -c "$reports/archive-sha256.txt"
      - name: Retain bounded reports, not images
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: v017-native-arm-vex-audit
          path: ${{ runner.temp }}/arm-vex/reports/
          retention-days: 3
          if-no-files-found: warn
