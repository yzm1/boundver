name: CI (disabled until v1.0.0)

on:
  workflow_dispatch:

jobs:
  disabled_notice:
    runs-on: ubuntu-latest
    steps:
      - name: CI disabled notice
        run: |
          echo "CI is intentionally disabled until v1.0.0."
          echo "Reason: runaway GitHub Actions costs during rapid development."
          echo "Restore automated push/pull_request triggers once development cadence and costs are stable."
