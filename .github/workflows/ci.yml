name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run tests
        run: pytest -v --tb=long --junit-xml=pytest_results.xml

      - name: Print failures
        if: failure()
        shell: python
        run: |
          import xml.etree.ElementTree as ET, sys
          try:
            tree = ET.parse("pytest_results.xml")
            root = tree.getroot()
            failed = []
            for tc in root.iter("testcase"):
              for child in tc:
                if child.tag in ("failure", "error"):
                  failed.append(f"{tc.attrib.get('classname')}.{tc.attrib.get('name')}")
                  print(f"FAIL: {tc.attrib.get('name')}", flush=True)
                  print(child.attrib.get("message","")[:400], flush=True)
                  print(child.text[:800] if child.text else "", flush=True)
                  print("---")
            print(f"\nTotal failures: {len(failed)}", flush=True)
          except Exception as e:
            print(f"Could not parse XML: {e}", flush=True)

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results-${{ matrix.os }}-py${{ matrix.python-version }}
          path: pytest_results.xml

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build package
        run: |
          python -m pip install --upgrade pip
          pip install build
          python -m build

      - name: Install and smoke-test
        run: |
          pip install dist/*.whl
          boundver --help
          boundver init --out /tmp/test.config.json --force

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
