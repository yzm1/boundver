name: Publish release container
run-name: container:${{ inputs.release_tag }}@${{ inputs.release_sha }}

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Immutable vMAJOR.MINOR.PATCH release tag.
        required: true
        type: string
      release_sha:
        description: Exact commit referenced by the release tag.
        required: true
        type: string
  workflow_call:
    inputs:
      release_tag:
        description: Immutable vMAJOR.MINOR.PATCH release tag.
        required: true
        type: string
      release_sha:
        description: Exact commit referenced by the release tag.
        required: true
        type: string
      reuse_retained_artifact:
        description: Reuse the prevalidated OCI artifact retained by the caller.
        required: false
        default: false
        type: boolean
      retained_artifact_name:
        description: Exact current-run artifact name selected by its producing job.
        required: false
        default: ""
        type: string

permissions: {}

concurrency:
  # The parent publication holds a repository-wide promotion lock. A separate
  # exact-tag mutex prevents direct and reusable invocations from racing each
  # other without deadlocking the parent workflow.
  group: boundver-release-container-${{ inputs.release_tag }}
  cancel-in-progress: false

env:
  ALL_PROXY: ""
  BASH_ENV: ""
  CDPATH: ""
  CURL_CA_BUNDLE: ""
  CURL_HOME: ""
  ENV: ""
  GCM_INTERACTIVE: never
  GLOBIGNORE: ""
  GH_NO_EXTENSION_UPDATE_NOTIFIER: "1"
  GH_NO_UPDATE_NOTIFIER: "1"
  GH_HOST: github.com
  GH_PAGER: cat
  GH_PROMPT_DISABLED: "1"
  GIT_NO_LAZY_FETCH: "1"
  GIT_NO_REPLACE_OBJECTS: "1"
  GIT_OPTIONAL_LOCKS: "0"
  GIT_PAGER: cat
  GIT_TERMINAL_PROMPT: "0"
  HTTPS_PROXY: ""
  HTTP_PROXY: ""
  NODE_EXTRA_CA_CERTS: ""
  NO_COLOR: "1"
  NO_PROXY: github.com,api.github.com
  REQUESTS_CA_BUNDLE: ""
  SSL_CERT_DIR: ""
  SSL_CERT_FILE: ""
  SSLKEYLOGFILE: ""
  TERM: dumb
  all_proxy: ""
  http_proxy: ""
  https_proxy: ""
  no_proxy: github.com,api.github.com
  RELEASE_TAG: ${{ inputs.release_tag }}
  RELEASE_SHA: ${{ inputs.release_sha }}
  IMAGE: ghcr.io/yzm1/boundver
  TRIVY_IMAGE: ghcr.io/aquasecurity/trivy@sha256:7cced7cae583819fc7806d4cbc0dbbc7cad18b99f7d3e235192e6da8c091045c
  DOCKER_BUILD_RECORD_UPLOAD: "false"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
    outputs:
      artifact-name: ${{ steps.artifact.outputs.name }}
    steps:
      - name: Bind the read-only build to the immutable release tag
        id: identity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid exact release tag: $RELEASE_TAG" >&2
            exit 1
          fi
          if [[ ! "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid release SHA: $RELEASE_SHA" >&2
            exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" >/dev/null
          tag_sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq '.sha')
          if [[ ! "$tag_sha" =~ ^[0-9a-f]{40}$ || "$tag_sha" != "$RELEASE_SHA" ]]; then
            echo "Release tag does not reference the approved commit" >&2
            exit 1
          fi
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Bind consumers to the artifact-producing attempt
        id: artifact
        shell: bash
        env:
          RETAINED_ARTIFACT_NAME: ${{ inputs.retained_artifact_name }}
          REUSE_RETAINED_ARTIFACT: ${{ inputs.reuse_retained_artifact }}
        run: |
          set -euo pipefail
          if [[ "$REUSE_RETAINED_ARTIFACT" == true ]]; then
            if [[ ! "$RETAINED_ARTIFACT_NAME" =~ ^boundver-container-${GITHUB_RUN_ID}-([1-9][0-9]*)$ ]]; then
              echo "Retained container artifact name is malformed or cross-run" >&2
              exit 1
            fi
            artifact_attempt=${BASH_REMATCH[1]}
            if (( artifact_attempt > GITHUB_RUN_ATTEMPT )); then
              echo "Retained container artifact comes from a future attempt" >&2
              exit 1
            fi
            artifact_name=$RETAINED_ARTIFACT_NAME
          else
            if [[ -n "$RETAINED_ARTIFACT_NAME" ]]; then
              echo "A retained artifact name requires recovery mode" >&2
              exit 1
            fi
            artifact_name="boundver-container-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          fi
          echo "name=$artifact_name" >> "$GITHUB_OUTPUT"

      - name: Checkout the released commit without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
          ref: ${{ inputs.release_sha }}

      - name: Record the reproducible image timestamp
        if: inputs.reuse_retained_artifact != true
        id: timestamp
        shell: bash
        run: |
          set -euo pipefail
          timestamp=$(git show -s --format=%ct "$RELEASE_SHA")
          if [[ ! "$timestamp" =~ ^[1-9][0-9]{0,11}$ ]]; then
            echo "Release commit timestamp is malformed" >&2
            exit 1
          fi
          echo "epoch=$timestamp" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        if: inputs.reuse_retained_artifact != true
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          image: tonistiigi/binfmt:qemu-v10.2.3@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
          platforms: arm64

      - name: Set up Docker Buildx
        if: inputs.reuse_retained_artifact != true
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          version: v0.36.1
          driver-opts: image=moby/buildkit:v0.32.2@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8

      - name: Build the retained multi-platform OCI image
        if: inputs.reuse_retained_artifact != true
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        env:
          SOURCE_DATE_EPOCH: ${{ steps.timestamp.outputs.epoch }}
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          provenance: false
          sbom: false
          tags: ${{ env.IMAGE }}:${{ steps.identity.outputs.version }}
          build-args: |
            BUILDKIT_MULTI_PLATFORM=1
            BOUNDVER_VERSION=${{ steps.identity.outputs.version }}
            BOUNDVER_REVISION=${{ inputs.release_sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.url=https://yzm1.github.io/boundver/
            org.opencontainers.image.documentation=https://yzm1.github.io/boundver/
            org.opencontainers.image.title=boundver
            org.opencontainers.image.description=Contract-drift classification and downstream impact for polyglot repositories
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.version=${{ steps.identity.outputs.version }}
            org.opencontainers.image.revision=${{ inputs.release_sha }}
          outputs: type=oci,dest=${{ runner.temp }}/boundver.oci.tar,rewrite-timestamp=true

      - name: Retain the exact OCI image for the protected publisher
        if: inputs.reuse_retained_artifact != true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: ${{ runner.temp }}/boundver.oci.tar
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Require the prevalidated retained image in recovery mode
        if: inputs.reuse_retained_artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: ${{ runner.temp }}/recovered-container-check

      - name: Validate the recovered image handoff
        if: inputs.reuse_retained_artifact
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/recovered-container-check/boundver.oci.tar"
          if [[ ! -f "$archive" || -L "$archive" ]]; then
            echo "Prevalidated retained OCI archive is absent or unsafe" >&2
            exit 1
          fi
          if [[ $(find "$RUNNER_TEMP/recovered-container-check" -mindepth 1 \
                    -maxdepth 1 -printf '.' | wc -c) -ne 1 ]]; then
            echo "Prevalidated retained OCI artifact has unexpected entries" >&2
            exit 1
          fi
          size=$(stat --format=%s "$archive")
          if [[ ! "$size" =~ ^[1-9][0-9]*$ || "$size" -gt 2147483648 ]]; then
            echo "Prevalidated retained OCI archive is empty or exceeds 2 GiB" >&2
            exit 1
          fi

      - name: Reject new or fixable high-severity container vulnerabilities
        shell: bash
        env:
          REUSE_RETAINED_ARTIFACT: ${{ inputs.reuse_retained_artifact }}
        run: |
          set -euo pipefail
          if [[ "$REUSE_RETAINED_ARTIFACT" == true ]]; then
            archive=/scan/recovered-container-check/boundver.oci.tar
          else
            archive=/scan/boundver.oci.tar
          fi
          cache="$RUNNER_TEMP/trivy-cache"
          mkdir -m 700 "$cache"
          scan=(
            docker run --rm
            --volume "$RUNNER_TEMP:/scan:ro"
            --volume "$GITHUB_WORKSPACE:/policy:ro"
            --volume "$cache:/root/.cache"
            "$TRIVY_IMAGE" image
            --input "$archive"
            --scanners vuln
            --severity HIGH,CRITICAL
            --max-image-size 2GB
            --no-progress
            --skip-version-check
          )
          for platform in linux/amd64 linux/arm64; do
            "${scan[@]}" --platform "$platform" \
              --ignorefile /policy/.trivyignore.yaml --exit-code 1
            "${scan[@]}" --platform "$platform" \
              --ignore-unfixed --exit-code 1
          done

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: container
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
      packages: write
    outputs:
      digest: ${{ steps.identity.outputs.digest }}
    steps:
      - name: Install the pinned OCI registry client
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1
        with:
          version: 1.3.2

      - name: Download the retained read-only build output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.build.outputs.artifact-name }}
          path: ${{ runner.temp }}/container

      - name: Validate the retained OCI archive identity
        id: archive
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/container/boundver.oci.tar"
          if [[ ! -f "$archive" || -L "$archive" ]]; then
            echo "Retained OCI archive is absent or not a regular file" >&2
            exit 1
          fi
          size=$(stat --format=%s "$archive")
          if [[ ! "$size" =~ ^[1-9][0-9]*$ || "$size" -gt 2147483648 ]]; then
            echo "Retained OCI archive is empty or exceeds 2 GiB" >&2
            exit 1
          fi
          if [[ $(tar -tf "$archive" | grep -c '^index.json$') -ne 1 ]]; then
            echo "Retained OCI archive must contain one root index" >&2
            exit 1
          fi
          tar -xOf "$archive" index.json > "$RUNNER_TEMP/container-index.json"
          digest=$(jq -er '
            select(.schemaVersion == 2)
            | .manifests
            | select(type == "array" and length == 1)
            | .[0].digest
            | select(test("^sha256:[0-9a-f]{64}$"))
          ' "$RUNNER_TEMP/container-index.json")
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR with the repository token
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | oras login ghcr.io \
            --username "$GITHUB_ACTOR" --password-stdin

      - name: Reject conflicting exact image state
        id: preflight
        shell: bash
        env:
          ARCHIVE_DIGEST: ${{ steps.archive.outputs.digest }}
        run: |
          set -euo pipefail
          version=${RELEASE_TAG#v}
          descriptor=$(mktemp)
          diagnostic=$(mktemp)
          set +e
          oras manifest fetch --descriptor "$IMAGE:$version" >"$descriptor" 2>"$diagnostic"
          inspect_exit=$?
          set -e
          if [[ $(wc -c <"$descriptor") -gt 65536 || $(wc -c <"$diagnostic") -gt 65536 ]]; then
            echo "Registry inspection exceeded its diagnostic limit" >&2
            exit 1
          fi
          if [[ $inspect_exit -eq 0 ]]; then
            digest=$(jq -er '.digest | select(test("^sha256:[0-9a-f]{64}$"))' "$descriptor")
            if [[ "$digest" != "$ARCHIVE_DIGEST" ]]; then
              echo "Existing exact image differs from the retained release build" >&2
              exit 1
            fi
            echo "state=existing" >> "$GITHUB_OUTPUT"
          elif grep -Eiq '404|manifest unknown|not found|name unknown' "$diagnostic"; then
            echo "state=missing" >> "$GITHUB_OUTPUT"
          else
            echo "Cannot classify GHCR preflight failure" >&2
            sed -n '1,40p' "$diagnostic" >&2
            exit 1
          fi

      - name: Publish the missing OCI image without executing candidate code
        if: steps.preflight.outputs.state == 'missing'
        shell: bash
        env:
          ARCHIVE_DIGEST: ${{ steps.archive.outputs.digest }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/container/boundver.oci.tar"
          version=${RELEASE_TAG#v}
          # ORAS 1.3.2 supports OCI layout tar archives as --from-oci-layout
          # sources. Address the retained Buildx archive by its root digest.
          oras cp --from-oci-layout \
            "$archive@$ARCHIVE_DIGEST" "$IMAGE:$version"
          published=$(oras manifest fetch --descriptor "$IMAGE:$version" \
            | jq -er '.digest | select(test("^sha256:[0-9a-f]{64}$"))')
          if [[ "$published" != "$ARCHIVE_DIGEST" ]]; then
            echo "GHCR changed the retained manifest identity" >&2
            exit 1
          fi

      - name: Select and validate the one exact image digest
        id: identity
        shell: bash
        env:
          ARCHIVE_DIGEST: ${{ steps.archive.outputs.digest }}
        run: |
          set -euo pipefail
          oras manifest fetch "$IMAGE@$ARCHIVE_DIGEST" \
            > "$RUNNER_TEMP/published-manifest.json"
          jq -e '
            .mediaType == "application/vnd.oci.image.index.v1+json"
            and (.manifests | type == "array" and length == 2)
            and ([.manifests[].platform | "\(.os)/\(.architecture)"] | sort
                 == ["linux/amd64", "linux/arm64"])
          ' "$RUNNER_TEMP/published-manifest.json" >/dev/null
          echo "digest=$ARCHIVE_DIGEST" >> "$GITHUB_OUTPUT"

      - name: Attest the exact image digest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.identity.outputs.digest }}
          push-to-registry: true

  verify-public:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: container-public
    permissions:
      attestations: read
      contents: read
      packages: read
    steps:
      - name: Verify anonymous pull, immutable labels, runtime, and attestation
        shell: bash
        env:
          DIGEST: ${{ needs.publish.outputs.digest }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=${RELEASE_TAG#v}
          anonymous_config=$(mktemp -d)
          DOCKER_CONFIG="$anonymous_config" docker pull \
            --platform linux/amd64 "$IMAGE@$DIGEST"
          actual_version=$(docker image inspect \
            --format '{{ index .Config.Labels "org.opencontainers.image.version" }}' \
            "$IMAGE@$DIGEST")
          actual_revision=$(docker image inspect \
            --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' \
            "$IMAGE@$DIGEST")
          actual_source=$(docker image inspect \
            --format '{{ index .Config.Labels "org.opencontainers.image.source" }}' \
            "$IMAGE@$DIGEST")
          test "$actual_version" = "$version"
          test "$actual_revision" = "$RELEASE_SHA"
          test "$actual_source" = "https://github.com/$GITHUB_REPOSITORY"
          DOCKER_CONFIG="$anonymous_config" docker run --rm \
            --platform linux/amd64 "$IMAGE@$DIGEST" --version \
            | grep -Fx "boundver $version"
          gh attestation verify "oci://$IMAGE@$DIGEST" --repo "$GITHUB_REPOSITORY"
