name: Publish to PyPI

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

jobs:
  verify-release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Validate tag and package version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - "$RELEASE_TAG" <<'PY'
          import pathlib
          import sys
          import tomllib

          expected = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"]
          actual = sys.argv[1]
          if actual != f"v{expected}":
              raise SystemExit(f"tag {actual!r} does not match package version v{expected}")
          PY

      - name: Test and build
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]' twine
          pytest -q
          python -m build
          python -m twine check dist/*
          python -m zipfile --list dist/*.whl
          tar -tzf dist/*.tar.gz

      - name: Upload verified distributions
        uses: actions/upload-artifact@v4
        with:
          name: release-dist
          path: dist/

  publish:
    runs-on: ubuntu-latest
    needs: verify-release
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download verified distributions
        uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  release:
    runs-on: ubuntu-latest
    needs: publish
    permissions:
      contents: write
    steps:
      - name: Checkout the released commit
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download verified distributions
        uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: dist

      - name: Advance the stable v0 tag
        shell: bash
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git tag --force v0 "$RELEASE_SHA"
          git push origin refs/tags/v0 --force
          remote_sha=$(git ls-remote origin refs/tags/v0 | awk '{print $1}')
          test "$remote_sha" = "$RELEASE_SHA"

      - name: Create the GitHub Release from verified artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" dist/* \
              --verify-tag \
              --title "boundver ${RELEASE_TAG#v}" \
              --generate-notes
          fi
