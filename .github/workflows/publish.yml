name: Promote verified release
run-name: publish:${{ inputs.release_tag }}@${{ inputs.release_sha }}:alias=${{ inputs.compatibility_alias }}:resume=${{ inputs.resume_run_id }}

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing exact version tag to promote.
        required: true
        type: string
      release_sha:
        description: Exact current-main commit referenced by the version tag.
        required: true
        type: string
      compatibility_alias:
        description: Explicit vMAJOR.MINOR Action alias to advance, or none.
        required: true
        type: string
      resume_run_id:
        description: Completed publication run whose verified artifacts should be reused.
        required: false
        default: ""
        type: string

concurrency:
  # Promotion mutates repository-wide release state (Releases, registries, and
  # mutable Action aliases), so different versions must not promote in parallel.
  group: boundver-release-promotion
  cancel-in-progress: false

permissions: {}

env:
  ALL_PROXY: ""
  BASH_ENV: ""
  CDPATH: ""
  CURL_CA_BUNDLE: ""
  CURL_HOME: ""
  GCM_INTERACTIVE: never
  GLOBIGNORE: ""
  GH_NO_EXTENSION_UPDATE_NOTIFIER: "1"
  GH_NO_UPDATE_NOTIFIER: "1"
  GH_HOST: github.com
  GH_PAGER: cat
  GH_PROMPT_DISABLED: "1"
  GIT_NO_LAZY_FETCH: "1"
  GIT_NO_REPLACE_OBJECTS: "1"
  GIT_OPTIONAL_LOCKS: "0"
  GIT_PAGER: cat
  GIT_TERMINAL_PROMPT: "0"
  HTTPS_PROXY: ""
  HTTP_PROXY: ""
  ENV: ""
  NODE_EXTRA_CA_CERTS: ""
  NO_COLOR: "1"
  NO_PROXY: github.com,api.github.com
  REQUESTS_CA_BUNDLE: ""
  SSL_CERT_DIR: ""
  SSL_CERT_FILE: ""
  SSLKEYLOGFILE: ""
  TERM: dumb
  RELEASE_TAG: ${{ inputs.release_tag }}
  RELEASE_SHA: ${{ inputs.release_sha }}
  COMPATIBILITY_ALIAS: ${{ inputs.compatibility_alias }}
  RESUME_RUN_ID: ${{ inputs.resume_run_id }}

jobs:
  verify-release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
      issues: read
      pull-requests: read
    outputs:
      source-run-id: ${{ steps.select-artifacts.outputs.source-run-id }}
      python-dist-artifact-id: ${{ steps.select-artifacts.outputs.python-dist-artifact-id }}
      release-assets-artifact-id: ${{ steps.select-artifacts.outputs.release-assets-artifact-id }}
      container-artifact-id: ${{ steps.select-artifacts.outputs.container-artifact-id }}
      container-artifact-name: ${{ steps.recovered-container-handoff.outputs.name }}
    steps:
      - name: Bind this dispatch to the exact version tag and commit
        shell: bash
        env:
          DISPATCH_EVENT: ${{ github.event_name }}
          DISPATCH_REF: ${{ github.ref }}
          DISPATCH_REF_NAME: ${{ github.ref_name }}
          DISPATCH_REF_TYPE: ${{ github.ref_type }}
          DISPATCH_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$DISPATCH_EVENT" != workflow_dispatch ]]; then
            echo "Publication must be started by workflow_dispatch" >&2
            exit 1
          fi
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid exact release tag: $RELEASE_TAG" >&2
            exit 1
          fi
          if [[ ! "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid release SHA: $RELEASE_SHA" >&2
            exit 1
          fi
          if [[ -z "$RESUME_RUN_ID" ]]; then
            if [[ "$DISPATCH_REF_TYPE" != tag || \
                  "$DISPATCH_REF_NAME" != "$RELEASE_TAG" || \
                  "$DISPATCH_REF" != "refs/tags/$RELEASE_TAG" ]]; then
              echo "Fresh publication must execute from exact tag ref refs/tags/$RELEASE_TAG" >&2
              exit 1
            fi
            if [[ "$DISPATCH_SHA" != "$RELEASE_SHA" ]]; then
              echo "Dispatch SHA $DISPATCH_SHA does not match release SHA $RELEASE_SHA" >&2
              exit 1
            fi
          else
            if [[ ! "$RESUME_RUN_ID" =~ ^[1-9][0-9]*$ ]]; then
              echo "Recovery source run ID must be a positive integer" >&2
              exit 1
            fi
            if [[ "$DISPATCH_REF_TYPE" != branch || \
                  "$DISPATCH_REF_NAME" != main || \
                  "$DISPATCH_REF" != refs/heads/main ]]; then
              echo "Recovery must execute from refs/heads/main" >&2
              exit 1
            fi
            remote_main=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" \
              --jq '.object.sha')
            if [[ ! "$remote_main" =~ ^[0-9a-f]{40}$ || \
                  "$DISPATCH_SHA" != "$remote_main" ]]; then
              echo "Recovery workflow SHA is not current remote main: $DISPATCH_SHA != $remote_main" >&2
              exit 1
            fi
          fi
          expected_alias="v${RELEASE_TAG#v}"
          expected_alias="${expected_alias%.*}"
          if [[ "$COMPATIBILITY_ALIAS" != none && \
                "$COMPATIBILITY_ALIAS" != "$expected_alias" ]]; then
            echo "Compatibility alias must be $expected_alias or none" >&2
            exit 1
          fi

      - name: Checkout the recovery control commit
        if: inputs.resume_run_id != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.sha }}
          path: .release-control

      - name: Require successful CI for the exact recovery control commit
        if: inputs.resume_run_id != ''
        shell: bash
        env:
          CONTROL_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          matching_runs=$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$CONTROL_SHA&event=push&per_page=100" \
            --jq '[.workflow_runs[] | select(.head_branch == "main" and .head_sha == env.CONTROL_SHA and .event == "push" and .status == "completed" and .conclusion == "success")] | length')
          if [[ ! "$matching_runs" =~ ^[0-9]+$ || "$matching_runs" -lt 1 ]]; then
            echo "Recovery requires successful CI for current main $CONTROL_SHA" >&2
            exit 1
          fi

      - name: Require current reviews for the recovery control commit
        if: inputs.resume_run_id != ''
        shell: bash
        working-directory: .release-control
        env:
          CONTROL_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash scripts/audit_release_reviews.sh \
            "$CONTROL_SHA" "$RELEASE_TAG"

      - name: Rebind recovery to current main after its control audit
        if: inputs.resume_run_id != ''
        shell: bash
        env:
          CONTROL_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git -C .release-control fetch --no-tags origin main
          current_main=$(git -C .release-control rev-parse FETCH_HEAD)
          if [[ "$current_main" != "$CONTROL_SHA" ]]; then
            echo "Main advanced during recovery control validation: $CONTROL_SHA != $current_main" >&2
            exit 1
          fi
          helper=.release-control/scripts/release_workflow.py
          if [[ ! -f "$helper" || -L "$helper" ]]; then
            echo "Reviewed recovery helper is unavailable" >&2
            exit 1
          fi
          cp "$helper" "$RUNNER_TEMP/release_workflow.py"

      - name: Checkout the released commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ inputs.release_sha }}

      - name: Require current reviews for the exact fresh release commit
        if: inputs.resume_run_id == ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash scripts/audit_release_reviews.sh "$RELEASE_SHA" "$RELEASE_TAG"

      - name: Require exact-tree semantic-provider release evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$RELEASE_TAG" == v0.15.0 ]]; then
            clean_python_cwd=$(mktemp -d)
            (cd "$clean_python_cwd" && python3 -I \
              "$GITHUB_WORKSPACE/scripts/audit_semantic_provider_proposal.py" \
              --gate v0.15-release \
              --release-tag "$RELEASE_TAG" \
              --release-sha "$RELEASE_SHA")
          fi

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Validate main, tag, commit, and package version
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          python -I - "$RELEASE_TAG" "$RELEASE_SHA" <<'PY'
          import pathlib
          import re
          import subprocess
          import sys
          import tomllib

          MAX_PROJECT_METADATA_BYTES = 1024 * 1024
          MAX_TOML_INTEGER_DIGITS = 640
          MAX_VERSION_BYTES = 1024
          READ_CHUNK_BYTES = 64 * 1024

          def read_project_text(path):
              advertised = path.stat().st_size
              if advertised > MAX_PROJECT_METADATA_BYTES:
                  raise SystemExit("pyproject.toml exceeds the metadata safety limit")
              chunks = []
              total = 0
              with path.open("rb") as stream:
                  while total < MAX_PROJECT_METADATA_BYTES:
                      chunk = stream.read(
                          min(READ_CHUNK_BYTES, MAX_PROJECT_METADATA_BYTES - total)
                      )
                      if not chunk:
                          break
                      chunks.append(chunk)
                      total += len(chunk)
                  if stream.read(1):
                      raise SystemExit("pyproject.toml exceeds the metadata safety limit")
              if total != advertised:
                  raise SystemExit("pyproject.toml changed while being read")
              try:
                  return b"".join(chunks).decode("utf-8")
              except UnicodeDecodeError as error:
                  raise SystemExit("pyproject.toml is not UTF-8") from error

          def toml_has_oversized_numeric_token(text):
              index = 0
              state = "normal"
              root_in_value = False
              table_header_depth = 0
              at_statement_start = True
              array_frame = 0
              inline_key_frame = 1
              inline_value_frame = 2
              containers = bytearray()

              def in_key_context():
                  if table_header_depth:
                      return True
                  if containers:
                      return containers[-1] == inline_key_frame
                  return not root_in_value

              def reset_line():
                  nonlocal root_in_value, table_header_depth, at_statement_start
                  if not containers:
                      root_in_value = False
                      table_header_depth = 0
                      at_statement_start = True

              while index < len(text):
                  char = text[index]
                  if state == "comment":
                      if char in "\r\n":
                          state = "normal"
                          reset_line()
                      index += 1
                      continue
                  if state in {"basic", "multiline-basic"}:
                      if char == "\\":
                          index += 2
                          continue
                      if state == "basic" and char == '"':
                          state = "normal"
                          index += 1
                          continue
                      if state == "multiline-basic" and char == '"':
                          end = index
                          while end < len(text) and text[end] == '"':
                              end += 1
                          if end - index >= 3:
                              state = "normal"
                          index = end
                          continue
                      index += 1
                      continue
                  if state in {"literal", "multiline-literal"}:
                      if state == "literal" and char == "'":
                          state = "normal"
                          index += 1
                          continue
                      if state == "multiline-literal" and char == "'":
                          end = index
                          while end < len(text) and text[end] == "'":
                              end += 1
                          if end - index >= 3:
                              state = "normal"
                          index = end
                          continue
                      index += 1
                      continue
                  if char == "#":
                      state = "comment"
                      index += 1
                      continue
                  if char in "\r\n":
                      reset_line()
                      index += 1
                      continue
                  if char in " \t":
                      index += 1
                      continue
                  if text.startswith('\"\"\"', index):
                      state = "multiline-basic"
                      at_statement_start = False
                      index += 3
                      continue
                  if text.startswith("'''", index):
                      state = "multiline-literal"
                      at_statement_start = False
                      index += 3
                      continue
                  if char == '"':
                      state = "basic"
                      at_statement_start = False
                      index += 1
                      continue
                  if char == "'":
                      state = "literal"
                      at_statement_start = False
                      index += 1
                      continue
                  if char == "[":
                      if table_header_depth:
                          table_header_depth += 1
                      elif not containers and not root_in_value and at_statement_start:
                          table_header_depth = 1
                      else:
                          containers.append(array_frame)
                      at_statement_start = False
                      index += 1
                      continue
                  if char == "]":
                      if table_header_depth:
                          table_header_depth -= 1
                      elif containers and containers[-1] == array_frame:
                          containers.pop()
                      at_statement_start = False
                      index += 1
                      continue
                  if char == "{":
                      containers.append(inline_key_frame)
                      at_statement_start = False
                      index += 1
                      continue
                  if char == "}":
                      if containers and containers[-1] in {
                          inline_key_frame,
                          inline_value_frame,
                      }:
                          containers.pop()
                      at_statement_start = False
                      index += 1
                      continue
                  if char == "=":
                      if containers and containers[-1] == inline_key_frame:
                          containers[-1] = inline_value_frame
                      elif not containers and not table_header_depth:
                          root_in_value = True
                      at_statement_start = False
                      index += 1
                      continue
                  if char == ",":
                      if containers and containers[-1] == inline_value_frame:
                          containers[-1] = inline_key_frame
                      at_statement_start = False
                      index += 1
                      continue
                  if (
                      not in_key_context()
                      and char == "0"
                      and index + 1 < len(text)
                      and text[index + 1] in "bBoOxX"
                  ):
                      valid_digits = {
                          "b": "01",
                          "o": "01234567",
                          "x": "0123456789abcdefABCDEF",
                      }[text[index + 1].lower()]
                      index += 2
                      digits = 0
                      while index < len(text) and (
                          text[index] in valid_digits or text[index] == "_"
                      ):
                          if text[index] != "_":
                              digits += 1
                              if digits > MAX_TOML_INTEGER_DIGITS:
                                  return True
                          index += 1
                      continue
                  if not in_key_context() and "0" <= char <= "9":
                      digits = 0
                      while index < len(text) and (
                          "0" <= text[index] <= "9" or text[index] == "_"
                      ):
                          if text[index] != "_":
                              digits += 1
                              if digits > MAX_TOML_INTEGER_DIGITS:
                                  return True
                          index += 1
                      continue
                  at_statement_start = False
                  index += 1
              return False

          def strict_toml_loads(document):
              if toml_has_oversized_numeric_token(document):
                  raise SystemExit(
                      "TOML numeric token exceeds the 640-digit safety limit"
                  )
              return tomllib.loads(document)

          document = read_project_text(pathlib.Path("pyproject.toml"))
          project = strict_toml_loads(document).get("project")
          expected = project.get("version") if isinstance(project, dict) else None
          if (
              not isinstance(expected, str)
              or len(expected.encode("utf-8")) > MAX_VERSION_BYTES
              or re.fullmatch(
                  r"(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)",
                  expected,
              )
              is None
          ):
              raise SystemExit("pyproject.toml project.version is not a bounded string")
          actual = sys.argv[1]
          release_sha = sys.argv[2]
          if re.fullmatch(r"[0-9a-f]{40}", release_sha) is None:
              raise SystemExit(f"invalid release SHA: {release_sha!r}")
          if actual != f"v{expected}":
              raise SystemExit(f"tag {actual!r} does not match package version v{expected}")
          head_sha = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          if head_sha != release_sha:
              raise SystemExit(f"checked-out commit {head_sha} does not match {release_sha}")

          def remote_sha(ref: str) -> str:
              fields = subprocess.check_output(
                  ["git", "ls-remote", "origin", ref], text=True
              ).split()
              if not fields:
                  raise SystemExit(f"remote ref is missing: {ref}")
              return fields[0]

          tag_sha = remote_sha(f"refs/tags/{actual}")
          if tag_sha != release_sha:
              raise SystemExit(f"tag {actual!r} resolves to {tag_sha}, not {release_sha}")
          main_sha = remote_sha("refs/heads/main")
          ancestor = subprocess.run(
              ["git", "merge-base", "--is-ancestor", release_sha, main_sha]
          )
          if ancestor.returncode != 0:
              raise SystemExit(
                  f"release commit is not on main: {release_sha} (main={main_sha})"
              )
          PY

      - name: Require exact changelog release section
        shell: bash
        run: |
          set -euo pipefail
          python3 -I scripts/release_changelog.py \
            --tag "$RELEASE_TAG" \
            --output "$RUNNER_TEMP/release-notes.md"
          python3 -I scripts/verify_release_readiness.py --tag "$RELEASE_TAG"
          python3 -I scripts/lock_release_tools.py check

      - name: Install hash-locked release verification tools
        if: inputs.resume_run_id == ''
        run: |
          set -euo pipefail
          python -I scripts/install_locked_tools.py release
          python -I -m pip --isolated install --disable-pip-version-check \
            --no-index --no-deps --no-build-isolation -e .

      - name: Verify release candidate source and distributions
        if: inputs.resume_run_id == ''
        run: >-
          python -I scripts/verify_release_candidate.py
          --tag "$RELEASE_TAG"
          --release-sha "$RELEASE_SHA"

      - name: Upload verified distributions
        if: inputs.resume_run_id == ''
        id: upload-python-dist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-dist-${{ inputs.release_tag }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 90

      - name: Assemble standalone and checksummed GitHub Release assets
        if: inputs.resume_run_id == ''
        shell: bash
        run: |
          set -euo pipefail
          version=${RELEASE_TAG#v}
          pyz="dist/boundver-$version.pyz"
          test -f "$pyz"
          mkdir release-assets
          cp dist/*.whl dist/*.tar.gz "$pyz" release-assets/
          (
            cd release-assets
            LC_ALL=C sha256sum boundver-* > SHA256SUMS
            sha256sum --check --strict SHA256SUMS
          )

      - name: Upload verified GitHub Release assets
        if: inputs.resume_run_id == ''
        id: upload-release-assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets-${{ inputs.release_tag }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 90

      - name: Locate the exact source-run artifacts for recovery
        if: inputs.resume_run_id != ''
        id: recover-artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          clean_python_cwd=$(mktemp -d)
          recovery_args=(
            recover-artifacts
            --repository "$GITHUB_REPOSITORY"
            --run-id "$RESUME_RUN_ID"
            --tag "$RELEASE_TAG"
            --sha "$RELEASE_SHA"
            --output "$GITHUB_OUTPUT"
          )
          (cd "$clean_python_cwd" && python3 -I \
            "$RUNNER_TEMP/release_workflow.py" "${recovery_args[@]}")

      - name: Bind recovery policy to the source verification log
        if: inputs.resume_run_id != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFICATION_JOB_ID: ${{ steps.recover-artifacts.outputs.verification-job-id }}
        run: |
          set -euo pipefail
          clean_python_cwd=$(mktemp -d)
          evidence_args=(
            verify-input-log
            --repository "$GITHUB_REPOSITORY"
            --job-id "$VERIFICATION_JOB_ID"
            --tag "$RELEASE_TAG"
            --sha "$RELEASE_SHA"
            --alias "$COMPATIBILITY_ALIAS"
          )
          (cd "$clean_python_cwd" && python3 -I \
            "$RUNNER_TEMP/release_workflow.py" "${evidence_args[@]}")

      - name: Select the immutable artifact source
        id: select-artifacts
        shell: bash
        env:
          CURRENT_RUN_ID: ${{ github.run_id }}
          FRESH_PYTHON_ID: ${{ steps.upload-python-dist.outputs.artifact-id }}
          FRESH_PYTHON_DIGEST: ${{ steps.upload-python-dist.outputs.artifact-digest }}
          FRESH_RELEASE_ID: ${{ steps.upload-release-assets.outputs.artifact-id }}
          FRESH_RELEASE_DIGEST: ${{ steps.upload-release-assets.outputs.artifact-digest }}
          RECOVERED_RUN_ID: ${{ steps.recover-artifacts.outputs.source-run-id }}
          RECOVERED_PYTHON_ID: ${{ steps.recover-artifacts.outputs.python-dist-artifact-id }}
          RECOVERED_PYTHON_DIGEST: ${{ steps.recover-artifacts.outputs.python-dist-artifact-digest }}
          RECOVERED_RELEASE_ID: ${{ steps.recover-artifacts.outputs.release-assets-artifact-id }}
          RECOVERED_RELEASE_DIGEST: ${{ steps.recover-artifacts.outputs.release-assets-artifact-digest }}
          RECOVERED_CONTAINER_ID: ${{ steps.recover-artifacts.outputs.container-artifact-id }}
          RECOVERED_CONTAINER_DIGEST: ${{ steps.recover-artifacts.outputs.container-artifact-digest }}
        run: |
          set -euo pipefail
          workflow_script="$GITHUB_WORKSPACE/scripts/release_workflow.py"
          if [[ -n "$RESUME_RUN_ID" ]]; then
            workflow_script="$RUNNER_TEMP/release_workflow.py"
          fi
          python3 -I "$workflow_script" select-artifacts \
            --resume-run-id "$RESUME_RUN_ID" \
            --current-run-id "$CURRENT_RUN_ID" \
            --fresh-python-id "$FRESH_PYTHON_ID" \
            --fresh-python-digest "$FRESH_PYTHON_DIGEST" \
            --fresh-release-id "$FRESH_RELEASE_ID" \
            --fresh-release-digest "$FRESH_RELEASE_DIGEST" \
            --recovered-run-id "$RECOVERED_RUN_ID" \
            --recovered-python-id "$RECOVERED_PYTHON_ID" \
            --recovered-python-digest "$RECOVERED_PYTHON_DIGEST" \
            --recovered-release-id "$RECOVERED_RELEASE_ID" \
            --recovered-release-digest "$RECOVERED_RELEASE_DIGEST" \
            --recovered-container-id "$RECOVERED_CONTAINER_ID" \
            --recovered-container-digest "$RECOVERED_CONTAINER_DIGEST" \
            --output "$GITHUB_OUTPUT"

      - name: Download recovered Python distributions
        if: inputs.resume_run_id != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.select-artifacts.outputs.python-dist-artifact-id }}
          path: recovered-python-dist
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.select-artifacts.outputs.source-run-id }}
          merge-multiple: true

      - name: Download recovered GitHub Release assets
        if: inputs.resume_run_id != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.select-artifacts.outputs.release-assets-artifact-id }}
          path: recovered-release-assets
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.select-artifacts.outputs.source-run-id }}
          merge-multiple: true

      - name: Download the recovered retained OCI image
        if: inputs.resume_run_id != '' && steps.select-artifacts.outputs.container-artifact-id != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.select-artifacts.outputs.container-artifact-id }}
          path: recovered-container
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.select-artifacts.outputs.source-run-id }}
          merge-multiple: true

      - name: Fail on any recovered artifact archive digest mismatch
        if: inputs.resume_run_id != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHON_ARTIFACT_ID: ${{ steps.select-artifacts.outputs.python-dist-artifact-id }}
          PYTHON_ARTIFACT_DIGEST: ${{ steps.select-artifacts.outputs.python-dist-artifact-digest }}
          RELEASE_ARTIFACT_ID: ${{ steps.select-artifacts.outputs.release-assets-artifact-id }}
          RELEASE_ARTIFACT_DIGEST: ${{ steps.select-artifacts.outputs.release-assets-artifact-digest }}
          CONTAINER_ARTIFACT_ID: ${{ steps.select-artifacts.outputs.container-artifact-id }}
          CONTAINER_ARTIFACT_DIGEST: ${{ steps.select-artifacts.outputs.container-artifact-digest }}
        run: |
          set -euo pipefail
          readonly MAX_RECOVERED_ARCHIVE_BYTES=268435456
          clean_python_cwd=$(mktemp -d)
          verify_archive() {
            local artifact_id=$1
            local expected_digest=$2
            local output_path=$3
            local extracted_path=$4
            curl --disable --fail-with-body --location --silent --show-error \
              --connect-timeout 15 --max-time 180 \
              --max-redirs 5 \
              --max-filesize "$MAX_RECOVERED_ARCHIVE_BYTES" \
              --noproxy '*' --proto '=https' --proto-redir '=https' --tlsv1.2 \
              --cacert /etc/ssl/certs/ca-certificates.crt \
              --oauth2-bearer "$GH_TOKEN" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              --output "$output_path" \
              "https://api.github.com/repos/yzm1/boundver/actions/artifacts/$artifact_id/zip"
            if [[ ! -f "$output_path" || -L "$output_path" || \
                  "$(wc -c < "$output_path")" -gt "$MAX_RECOVERED_ARCHIVE_BYTES" ]]; then
              echo "Recovered artifact archive is unsafe or oversized" >&2
              exit 1
            fi
            archive_args=(
              verify-archive
              --archive "$output_path"
              --extracted "$extracted_path"
              --digest "$expected_digest"
            )
            (cd "$clean_python_cwd" && python3 -I \
              "$RUNNER_TEMP/release_workflow.py" "${archive_args[@]}")
          }
          verify_archive \
            "$PYTHON_ARTIFACT_ID" "$PYTHON_ARTIFACT_DIGEST" \
            "$RUNNER_TEMP/python-dist.zip" "$GITHUB_WORKSPACE/recovered-python-dist"
          verify_archive \
            "$RELEASE_ARTIFACT_ID" "$RELEASE_ARTIFACT_DIGEST" \
            "$RUNNER_TEMP/release-assets.zip" "$GITHUB_WORKSPACE/recovered-release-assets"
          if [[ -n "$CONTAINER_ARTIFACT_ID" ]]; then
            verify_archive \
              "$CONTAINER_ARTIFACT_ID" "$CONTAINER_ARTIFACT_DIGEST" \
              "$RUNNER_TEMP/container.zip" "$GITHUB_WORKSPACE/recovered-container"
          fi

      - name: Validate the exact recovered release payload
        if: inputs.resume_run_id != ''
        shell: bash
        run: |
          set -euo pipefail
          python3 -I "$RUNNER_TEMP/release_workflow.py" validate-payload \
            --python-dist "$GITHUB_WORKSPACE/recovered-python-dist" \
            --release-assets "$GITHUB_WORKSPACE/recovered-release-assets" \
            --tag "$RELEASE_TAG"
          python3 -I scripts/install_locked_tools.py release
          version=${RELEASE_TAG#v}
          python3 -I -m twine check \
            "recovered-python-dist/boundver-$version-py3-none-any.whl" \
            "recovered-python-dist/boundver-$version.tar.gz"

      - name: Re-retain the exact recovered OCI image for the protected publisher
        if: inputs.resume_run_id != '' && steps.select-artifacts.outputs.container-artifact-id != ''
        id: recovered-container-handoff
        shell: bash
        run: |
          set -euo pipefail
          echo "name=boundver-container-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            >> "$GITHUB_OUTPUT"

      - name: Upload the exact recovered OCI image for the protected publisher
        if: inputs.resume_run_id != '' && steps.select-artifacts.outputs.container-artifact-id != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.recovered-container-handoff.outputs.name }}
          path: recovered-container/boundver.oci.tar
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  testpypi-preflight:
    name: Reject conflicting TestPyPI release state
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: verify-release
    permissions:
      actions: read
      contents: read
    outputs:
      upload-required: ${{ steps.preflight.outputs.upload-required }}
    steps:
      - name: Checkout the released commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.release_sha }}

      - name: Checkout the reviewed release-control commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          path: .release-control

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Download the immutable Python distributions by artifact ID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.verify-release.outputs.python-dist-artifact-id }}
          path: dist
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.verify-release.outputs.source-run-id }}
          merge-multiple: true

      - name: Download exact GitHub Release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.verify-release.outputs.release-assets-artifact-id }}
          path: release-assets
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.verify-release.outputs.source-run-id }}
          merge-multiple: true

      - name: Fetch public GitHub Release state without executing repository code
        id: fetch-github-release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          response=$(mktemp "$RUNNER_TEMP/github-release-response.XXXXXX")
          set +e
          gh api --include "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" \
            > "$response" 2>&1
          api_exit=$?
          set -e
          echo "api-exit=$api_exit" >> "$GITHUB_OUTPUT"
          echo "response-path=$response" >> "$GITHUB_OUTPUT"

      - name: Parse public GitHub Release state in an isolated interpreter
        id: github-release-probe
        shell: bash
        env:
          API_EXIT: ${{ steps.fetch-github-release.outputs.api-exit }}
          RESPONSE_PATH: ${{ steps.fetch-github-release.outputs.response-path }}
        run: |
          set -euo pipefail
          clean_python_cwd=$(mktemp -d)
          (cd "$clean_python_cwd" && python3 -I \
            "$GITHUB_WORKSPACE/.release-control/scripts/probe_github_release.py" \
            --api-exit "$API_EXIT" \
            --response "$RESPONSE_PATH" \
            --runner-temp "$RUNNER_TEMP" \
            --github-output "$GITHUB_OUTPUT")

      - name: Verify an existing public Release without a token
        if: steps.github-release-probe.outputs.release-state == 'public'
        shell: bash
        run: |
          set -euo pipefail
          version=${RELEASE_TAG#v}
          verification_alias="$COMPATIBILITY_ALIAS"
          if [[ "$verification_alias" == none ]]; then
            verification_alias="v${version%.*}"
          fi
          clean_python_cwd=$(mktemp -d)
          (cd "$clean_python_cwd" && python3 -I \
            "$GITHUB_WORKSPACE/.release-control/scripts/release_changelog.py" \
            --changelog "$GITHUB_WORKSPACE/CHANGELOG.md" \
            --tag "$RELEASE_TAG" \
            --output "$RUNNER_TEMP/release-notes.md")
          (cd "$clean_python_cwd" && python3 -I \
            "$GITHUB_WORKSPACE/.release-control/scripts/verify_release_surfaces.py" \
            --tag "$RELEASE_TAG" \
            --sha "$RELEASE_SHA" \
            --alias "$verification_alias" \
            --dist-dir "$GITHUB_WORKSPACE/dist" \
            --release-notes "$RUNNER_TEMP/release-notes.md" \
            --release-assets-dir "$GITHUB_WORKSPACE/release-assets" \
            --phase github \
            --attempts 1 \
            --delay-seconds 0)

      - name: Accept only a missing, exact, or exact-partial TestPyPI release
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          python3 -I scripts/verify_testpypi_release.py preflight \
            --dist dist \
            --project boundver \
            --version "${RELEASE_TAG#v}" \
            --github-output "$GITHUB_OUTPUT"

  publish-testpypi:
    name: Publish immutable candidate to TestPyPI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [verify-release, testpypi-preflight]
    environment: testpypi
    permissions:
      actions: read
      id-token: write
    steps:
      - name: Download the immutable Python distributions by artifact ID
        if: needs.testpypi-preflight.outputs.upload-required == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.verify-release.outputs.python-dist-artifact-id }}
          path: dist
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.verify-release.outputs.source-run-id }}
          merge-multiple: true

      - name: Publish missing candidate files to TestPyPI
        if: needs.testpypi-preflight.outputs.upload-required == 'true'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist
          skip-existing: true
          attestations: true

  verify-testpypi:
    name: Verify and install the exact TestPyPI candidate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [verify-release, publish-testpypi]
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout the released commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.release_sha }}

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Download the immutable Python distributions by artifact ID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.verify-release.outputs.python-dist-artifact-id }}
          path: dist
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.verify-release.outputs.source-run-id }}
          merge-multiple: true

      - name: Verify TestPyPI filenames, sizes, hashes, and downloaded bytes
        id: verify-testpypi
        shell: bash
        run: |
          set -euo pipefail
          python3 -I scripts/verify_testpypi_release.py verify \
            --dist dist \
            --project boundver \
            --version "${RELEASE_TAG#v}" \
            --attempts 18 \
            --delay-seconds 10 \
            --github-output "$GITHUB_OUTPUT"

      - name: Install only the verified TestPyPI wheel
        shell: bash
        env:
          EXPECTED_VERSION: ${{ inputs.release_tag }}
          TESTPYPI_WHEEL_URL: ${{ steps.verify-testpypi.outputs.wheel-url }}
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
          PIP_NO_INDEX: "1"
        run: |
          set -euo pipefail
          case "$TESTPYPI_WHEEL_URL" in
            https://test-files.pythonhosted.org/*#sha256=*) ;;
            *) echo "Verifier returned a non-TestPyPI wheel URL" >&2; exit 1 ;;
          esac
          install_root=$(mktemp -d)
          python3 -I -m venv "$install_root/venv"
          "$install_root/venv/bin/python" -I -m pip --isolated install \
            --no-index --no-deps "$TESTPYPI_WHEEL_URL"
          actual=$(cd "$RUNNER_TEMP" && \
            "$install_root/venv/bin/python" -I -c \
              'import importlib.metadata; print(importlib.metadata.version("boundver"))')
          if [[ "v$actual" != "$EXPECTED_VERSION" ]]; then
            echo "Installed TestPyPI version v$actual != $EXPECTED_VERSION" >&2
            exit 1
          fi
          cd "$RUNNER_TEMP"
          "$install_root/venv/bin/python" -I -m boundver --version

      - name: Cryptographically verify TestPyPI trusted-publisher provenance
        shell: bash
        run: |
          set -euo pipefail
          python3 -I scripts/install_locked_tools.py release
          for artifact in dist/*.whl dist/*.tar.gz; do
            filename=$(basename "$artifact")
            provenance="$RUNNER_TEMP/$filename.provenance"
            python3 -I scripts/verify_testpypi_release.py provenance \
              --project boundver \
              --version "${RELEASE_TAG#v}" \
              --filename "$filename" \
              --output "$provenance"
            pypi-attestations verify pypi \
              --repository https://github.com/yzm1/boundver \
              --provenance-file "$provenance" "$artifact"
          done

  prepare-release-notes:
    name: Prepare immutable release notes without mutation authority
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [verify-release, verify-testpypi]
    permissions:
      contents: read
    outputs:
      release-notes-artifact-id: ${{ steps.upload-release-notes.outputs.artifact-id }}
    steps:
      - name: Checkout the released commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.release_sha }}

      - name: Generate release notes without credentials
        shell: bash
        run: |
          set -euo pipefail
          python3 -I scripts/release_changelog.py \
            --tag "$RELEASE_TAG" \
            --output "$RUNNER_TEMP/release-notes.md"
          test ! -L "$RUNNER_TEMP/release-notes.md"
          test -f "$RUNNER_TEMP/release-notes.md"
          test "$(wc -c < "$RUNNER_TEMP/release-notes.md")" -le 1048576

      - name: Upload the exact release notes
        id: upload-release-notes
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-notes-${{ inputs.release_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-notes.md
          if-no-files-found: error
          retention-days: 90

  prepare-release-draft:
    name: Prepare complete GitHub Release draft
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [verify-release, verify-testpypi, prepare-release-notes]
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download release assets by immutable artifact ID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.verify-release.outputs.release-assets-artifact-id }}
          path: release-assets
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.verify-release.outputs.source-run-id }}
          merge-multiple: true

      - name: Download release notes by immutable artifact ID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.prepare-release-notes.outputs.release-notes-artifact-id }}
          path: ${{ runner.temp }}/release-notes
          merge-multiple: true

      - name: Create or reconcile the exact release draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_DRAFT_API_PROGRAM: |
            import json
            import math
            import os
            import pathlib
            import re
            import shutil
            import subprocess
            import sys
            import tempfile
            import threading
            import time

            MAX_PAGE_BYTES = 8 * 1024 * 1024
            MAX_DETAIL_BYTES = 32 * 1024 * 1024
            MAX_TOTAL_BYTES = 32 * 1024 * 1024
            MAX_STDERR_BYTES = 64 * 1024
            MAX_PAGES = 100
            MAX_ITEMS = 10_000
            MAX_TAG_BYTES = 1024
            MAX_VISIBILITY_ATTEMPTS = 6
            VISIBILITY_RETRY_SECONDS = 2
            READ_CHUNK_BYTES = 64 * 1024
            MAX_UINT64 = (1 << 64) - 1
            MAX_JSON_NUMBER_CHARACTERS = 64

            mode, repository, *arguments = sys.argv[1:]
            if mode not in {"find", "wait", "capture"}:
                raise SystemExit("release API lookup mode is invalid")
            if re.fullmatch(r"[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+", repository) is None:
                raise SystemExit("release API repository is malformed")
            workspace = pathlib.Path(os.environ["GITHUB_WORKSPACE"]).resolve()
            runner_temp = pathlib.Path(os.environ["RUNNER_TEMP"]).resolve()
            gh = pathlib.Path(shutil.which("gh") or "").resolve()
            if not gh.is_file() or gh == workspace or workspace in gh.parents:
                raise SystemExit("trusted GitHub CLI is unavailable")
            gh_config_dir = pathlib.Path(
                tempfile.mkdtemp(prefix="boundver-gh-", dir=runner_temp)
            ).resolve()
            command_environment = dict(os.environ)
            for name in (
                "ALL_PROXY", "all_proxy", "BROWSER", "CLICOLOR_FORCE",
                "CURL_CA_BUNDLE", "CURL_HOME", "DEBUG", "EDITOR",
                "GH_ACCESSIBLE_COLORS", "GH_ACCESSIBLE_PROMPTER", "GH_BROWSER",
                "GH_DEBUG", "GH_EDITOR", "GH_ENTERPRISE_TOKEN", "GH_FORCE_TTY",
                "GH_HOST", "GH_HTTP_UNIX_SOCKET", "GH_MDWIDTH", "GH_PAGER",
                "GH_PROMPT_DISABLED", "GH_REPO", "GH_SPINNER_DISABLED",
                "GHES_TOKEN", "GITHUB_API_URL", "GITHUB_ENTERPRISE_TOKEN",
                "GITHUB_GRAPHQL_URL", "GITHUB_SERVER_URL", "GIT_EDITOR",
                "GLAMOUR_STYLE", "GODEBUG", "HTTPS_PROXY", "https_proxy",
                "HTTP_PROXY", "http_proxy", "NODE_EXTRA_CA_CERTS", "NO_PROXY",
                "no_proxy", "REQUESTS_CA_BUNDLE", "SSL_CERT_DIR",
                "SSL_CERT_FILE", "SSLKEYLOGFILE", "VISUAL",
            ):
                command_environment.pop(name, None)
            command_environment.update({
                "GH_CONFIG_DIR": str(gh_config_dir),
                "GH_HOST": "github.com",
                "GH_NO_EXTENSION_UPDATE_NOTIFIER": "1",
                "GH_NO_UPDATE_NOTIFIER": "1",
                "GH_PAGER": "cat",
                "GH_PROMPT_DISABLED": "1",
                "NO_COLOR": "1",
                "NO_PROXY": "github.com,api.github.com",
                "PAGER": "cat",
                "TERM": "dumb",
            })
            consumed_bytes = 0

            def kill_process(process):
                try:
                    process.kill()
                except OSError:
                    pass

            def read_pipe(process, pipe, label, limit, buffer, overflows, errors):
                try:
                    while True:
                        remaining_with_sentinel = max(1, limit - len(buffer) + 1)
                        reader = getattr(pipe, "read1", pipe.read)
                        chunk = reader(min(READ_CHUNK_BYTES, remaining_with_sentinel))
                        if not chunk:
                            return
                        if len(buffer) + len(chunk) > limit:
                            overflows.append(label)
                            kill_process(process)
                            return
                        buffer.extend(chunk)
                except (OSError, ValueError):
                    errors.append(label)
                    kill_process(process)
                finally:
                    try:
                        pipe.close()
                    except OSError:
                        pass

            def unique_object(pairs):
                result = {}
                for key, value in pairs:
                    if key in result:
                        raise ValueError("duplicate JSON object key")
                    result[key] = value
                return result

            def parse_integer(value):
                if len(value.lstrip("-")) > 20:
                    raise ValueError("oversized JSON integer")
                return int(value)

            def parse_float(value):
                if len(value) > MAX_JSON_NUMBER_CHARACTERS:
                    raise ValueError("oversized JSON float")
                result = float(value)
                if not math.isfinite(result):
                    raise ValueError("non-finite JSON float")
                return result

            def reject_constant(_value):
                raise ValueError("non-finite JSON constant")

            def api_json(endpoint, limit):
                global consumed_bytes
                remaining = MAX_TOTAL_BYTES - consumed_bytes
                stdout_limit = min(limit, remaining)
                if stdout_limit < 0:
                    raise SystemExit("release API responses exceed the aggregate limit")
                try:
                    process = subprocess.Popen(
                        [str(gh), "api", endpoint],
                        cwd=runner_temp,
                        env=command_environment,
                        stdin=subprocess.DEVNULL,
                        stdout=subprocess.PIPE,
                        stderr=subprocess.PIPE,
                    )
                except OSError as error:
                    raise SystemExit("release API command could not start") from error
                if process.stdout is None or process.stderr is None:
                    kill_process(process)
                    raise SystemExit("release API pipes are unavailable")
                stdout = bytearray()
                stderr = bytearray()
                overflows = []
                errors = []
                readers = [
                    threading.Thread(
                        target=read_pipe,
                        args=(process, process.stdout, "stdout", stdout_limit,
                              stdout, overflows, errors),
                        daemon=True,
                    ),
                    threading.Thread(
                        target=read_pipe,
                        args=(process, process.stderr, "stderr", MAX_STDERR_BYTES,
                              stderr, overflows, errors),
                        daemon=True,
                    ),
                ]
                for reader in readers:
                    reader.start()
                try:
                    returncode = process.wait(timeout=90)
                except subprocess.TimeoutExpired as error:
                    kill_process(process)
                    try:
                        process.wait(timeout=5)
                    except subprocess.TimeoutExpired:
                        pass
                    raise SystemExit("release API command timed out") from error
                finally:
                    for reader in readers:
                        reader.join(timeout=5)
                if any(reader.is_alive() for reader in readers):
                    kill_process(process)
                    raise SystemExit("release API pipes did not close")
                if errors:
                    raise SystemExit("release API response read failed")
                if overflows:
                    raise SystemExit("release API response exceeds the byte limit")
                if returncode != 0:
                    detail = stderr.decode("utf-8", "backslashreplace").strip()
                    raise SystemExit(f"release API request failed: {detail}")
                consumed_bytes += len(stdout)
                try:
                    payload = json.loads(
                        stdout.decode("utf-8", "strict"),
                        object_pairs_hook=unique_object,
                        parse_float=parse_float,
                        parse_int=parse_integer,
                        parse_constant=reject_constant,
                    )
                except (UnicodeDecodeError, ValueError) as error:
                    raise SystemExit("release API returned malformed JSON") from error
                return bytes(stdout), payload

            def validate_release_tag(value):
                if (
                    re.fullmatch(
                        r"v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)",
                        value,
                    )
                    is None
                    or len(value.encode("utf-8")) > MAX_TAG_BYTES
                ):
                    raise SystemExit("release-list tag is malformed")
                return value

            def find_release_id(release_tag):
                endpoint = f"repos/{repository}/releases?per_page=100"
                matches = []
                seen_items = 0
                seen_ids = set()
                for page_number in range(1, MAX_PAGES + 1):
                    _raw, page = api_json(
                        f"{endpoint}&page={page_number}", MAX_PAGE_BYTES
                    )
                    if not isinstance(page, list) or len(page) > 100:
                        raise SystemExit("GitHub Release list page is malformed")
                    seen_items += len(page)
                    if seen_items > MAX_ITEMS:
                        raise SystemExit("GitHub Release list exceeds the item limit")
                    for release in page:
                        if not isinstance(release, dict):
                            raise SystemExit("GitHub Release list entry is malformed")
                        tag_name = release.get("tag_name")
                        if (
                            not isinstance(tag_name, str)
                            or len(tag_name.encode("utf-8")) > MAX_TAG_BYTES
                        ):
                            raise SystemExit("GitHub Release has a malformed tag")
                        release_id = release.get("id")
                        if (
                            type(release_id) is not int
                            or not 1 <= release_id <= MAX_UINT64
                            or release_id in seen_ids
                        ):
                            raise SystemExit("GitHub Release has a malformed ID")
                        seen_ids.add(release_id)
                        if tag_name == release_tag:
                            matches.append(release_id)
                    if len(matches) > 1:
                        raise SystemExit("multiple GitHub Releases use the version tag")
                    if len(page) < 100:
                        if matches:
                            return matches[0]
                        return None
                else:
                    raise SystemExit("GitHub Release list exceeds the page limit")

            if mode in {"find", "wait"}:
                if len(arguments) != 1:
                    raise SystemExit("release-list lookup is incomplete")
                release_tag = validate_release_tag(arguments[0])
                if mode == "find":
                    release_id = find_release_id(release_tag)
                else:
                    release_id = None
                    for attempt in range(1, MAX_VISIBILITY_ATTEMPTS + 1):
                        release_id = find_release_id(release_tag)
                        if release_id is not None:
                            break
                        if attempt < MAX_VISIBILITY_ATTEMPTS:
                            print(
                                "Created GitHub Release is not visible yet; "
                                f"retrying ({attempt}/{MAX_VISIBILITY_ATTEMPTS})",
                                file=sys.stderr,
                            )
                            time.sleep(VISIBILITY_RETRY_SECONDS)
                    if release_id is None:
                        release_url = (
                            f"https://github.com/{repository}/releases/tag/"
                            f"{release_tag}"
                        )
                        raise SystemExit(
                            "GitHub Release was created but remained absent from "
                            f"the authenticated release list after "
                            f"{MAX_VISIBILITY_ATTEMPTS} attempts: {release_url}"
                        )
                if release_id is not None:
                    print(release_id)
            else:
                if len(arguments) != 2:
                    raise SystemExit("release-detail capture is incomplete")
                release_id_text, output_text = arguments
                if re.fullmatch(r"[1-9][0-9]{0,19}", release_id_text) is None:
                    raise SystemExit("GitHub Release ID is malformed")
                release_id = int(release_id_text)
                if release_id > MAX_UINT64:
                    raise SystemExit("GitHub Release ID exceeds the supported range")
                output = pathlib.Path(output_text).resolve()
                if (
                    not output.is_file()
                    or output.is_symlink()
                    or output.parent != runner_temp
                ):
                    raise SystemExit("release-detail output path is unsafe")
                raw, payload = api_json(
                    f"repos/{repository}/releases/{release_id}", MAX_DETAIL_BYTES
                )
                if not isinstance(payload, dict) or payload.get("id") != release_id:
                    raise SystemExit("GitHub Release detail disagrees with its identity")
                output.write_bytes(raw)
        run: |
          set -euo pipefail
          readonly repository_url="https://github.com/$GITHUB_REPOSITORY.git"
          readonly asset_dir="$GITHUB_WORKSPACE/release-assets"
          clean_python_cwd=$(mktemp -d)
          python_clean() {
            (cd "$clean_python_cwd" && python3 -I "$@")
          }
          tag_sha=$(git ls-remote "$repository_url" "refs/tags/$RELEASE_TAG" | awk '{print $1}')
          if [[ -z "$tag_sha" || "$tag_sha" != "$RELEASE_SHA" ]]; then
            echo "Version tag moved or disappeared: $RELEASE_TAG -> $tag_sha (expected $RELEASE_SHA)" >&2
            exit 1
          fi
          (cd "$asset_dir" && sha256sum --check --strict SHA256SUMS)
          notes_file="$RUNNER_TEMP/release-notes/release-notes.md"
          if [[ ! -f "$notes_file" || -L "$notes_file" || \
                "$(wc -c < "$notes_file")" -gt 1048576 ]]; then
            echo "Release-notes artifact is missing, unsafe, or oversized" >&2
            exit 1
          fi

          release_json_file=$(mktemp "$RUNNER_TEMP/release-json.XXXXXX")

          # GitHub's release-by-tag endpoint does not return draft releases.
          # Search the authenticated, paginated release list and bind every
          # later read to the unique numeric release ID instead.
          find_release_id() {
            python_clean -c "$RELEASE_DRAFT_API_PROGRAM" \
              find "$GITHUB_REPOSITORY" "$RELEASE_TAG"
          }
          wait_for_created_release_id() {
            python_clean -c "$RELEASE_DRAFT_API_PROGRAM" \
              wait "$GITHUB_REPOSITORY" "$RELEASE_TAG"
          }
          capture_release_json() {
            python_clean -c "$RELEASE_DRAFT_API_PROGRAM" \
              capture "$GITHUB_REPOSITORY" "$1" "$release_json_file"
          }

          if ! release_id=$(find_release_id); then
            exit 1
          fi
          if [[ -z "$release_id" ]]; then
            gh release create "$RELEASE_TAG" \
              --draft \
              --verify-tag \
              --title "boundver ${RELEASE_TAG#v}" \
              --notes-file "$notes_file"
            # gh prints the release URL but does not expose its numeric ID, and
            # GitHub's exact-tag endpoint excludes drafts. Wait for bounded
            # authenticated-list visibility, then bind all work to the ID.
            if ! release_id=$(wait_for_created_release_id); then
              exit 1
            fi
          fi
          if [[ ! "$release_id" =~ ^[1-9][0-9]*$ ]]; then
            echo "GitHub Release ID is malformed: $release_id" >&2
            exit 1
          fi
          if ! capture_release_json "$release_id"; then
            echo "GitHub Release state cannot be read by ID" >&2
            exit 1
          fi

          expected_assets=$(mktemp)
          missing_assets=$(mktemp)
          common_assets=$(mktemp)
          draft_state=$(mktemp "$RUNNER_TEMP/release-draft-state.XXXXXX")
          python_clean - \
            "$RELEASE_TAG" \
            "$asset_dir" \
            "$notes_file" \
            "$release_json_file" \
            "$expected_assets" \
            "$missing_assets" \
            "$common_assets" \
            "$draft_state" <<'PY'
          import json
          import math
          import pathlib
          import sys

          (
              release_tag,
              asset_dir_text,
              notes_path,
              release_json_path,
              expected_path,
              missing_path,
              common_path,
              draft_state_path,
          ) = sys.argv[1:]
          MAX_RELEASE_JSON_BYTES = 32 * 1024 * 1024
          MAX_NOTES_BYTES = 1024 * 1024
          MAX_RELEASE_ASSETS = 16
          MAX_ASSET_NAME_BYTES = 1024
          MAX_ASSET_BYTES = 128 * 1024 * 1024
          MAX_ASSET_TOTAL_BYTES = 256 * 1024 * 1024
          READ_CHUNK_BYTES = 64 * 1024

          def read_text_bounded(path_text, limit, label):
              path = pathlib.Path(path_text)
              advertised = path.stat().st_size
              if not 0 <= advertised <= limit:
                  raise SystemExit(f"{label} exceeds the byte limit")
              chunks = []
              total = 0
              with path.open("rb") as stream:
                  while total < limit:
                      requested = min(READ_CHUNK_BYTES, limit - total)
                      chunk = stream.read(requested)
                      if not chunk:
                          break
                      if len(chunk) > requested:
                          raise SystemExit(f"{label} exceeded a bounded read")
                      chunks.append(chunk)
                      total += len(chunk)
                  if stream.read(1):
                      raise SystemExit(f"{label} exceeds the byte limit")
              if total != advertised:
                  raise SystemExit(f"{label} changed while being read")
              try:
                  return b"".join(chunks).decode("utf-8", "strict")
              except UnicodeDecodeError as error:
                  raise SystemExit(f"{label} is not UTF-8") from error

          def unique_object(pairs):
              result = {}
              for key, value in pairs:
                  if key in result:
                      raise ValueError("duplicate JSON object key")
                  result[key] = value
              return result

          def parse_integer(value):
              if len(value.lstrip("-")) > 20:
                  raise ValueError("oversized JSON integer")
              return int(value)

          def parse_float(value):
              if len(value) > 64:
                  raise ValueError("oversized JSON float")
              result = float(value)
              if not math.isfinite(result):
                  raise ValueError("non-finite JSON float")
              return result

          def reject_constant(_value):
              raise ValueError("non-finite JSON constant")

          try:
              release = json.loads(
                  read_text_bounded(
                      release_json_path, MAX_RELEASE_JSON_BYTES, "GitHub Release response"
                  ),
                  object_pairs_hook=unique_object,
                  parse_float=parse_float,
                  parse_int=parse_integer,
                  parse_constant=reject_constant,
              )
          except ValueError as error:
              raise SystemExit("GitHub Release response is malformed") from error
          if not isinstance(release, dict):
              raise SystemExit("GitHub Release response is malformed")
          expected_title = f"boundver {release_tag.removeprefix('v')}"
          expected_notes = read_text_bounded(
              notes_path, MAX_NOTES_BYTES, "release notes"
          )
          def normalized_notes(value):
              return value.replace("\r\n", "\n").replace("\r", "\n").rstrip("\n")

          if release.get("name") != expected_title:
              raise SystemExit("GitHub Release title disagrees")
          body = release.get("body")
          if not isinstance(body, str) or normalized_notes(body) != normalized_notes(expected_notes):
              raise SystemExit("GitHub Release notes disagree")
          if release.get("tag_name") != release_tag:
              raise SystemExit("GitHub Release tag disagrees")
          draft = release.get("draft")
          if type(draft) is not bool:
              raise SystemExit("GitHub Release draft state is malformed")
          if release.get("prerelease") is not False:
              raise SystemExit("GitHub Release must not be a prerelease")
          if not draft and (
              release.get("immutable") is not True
              or not isinstance(release.get("published_at"), str)
              or not release["published_at"]
          ):
              raise SystemExit(
                  "Public GitHub Release must be immutable and have a publication timestamp"
              )

          asset_dir = pathlib.Path(asset_dir_text)
          local_entries = list(asset_dir.iterdir())
          if (
              len(local_entries) > MAX_RELEASE_ASSETS
              or any(not path.is_file() or path.is_symlink() for path in local_entries)
          ):
              raise SystemExit("local release assets must be regular files")
          local_sizes = {}
          local_total = 0
          for path in local_entries:
              try:
                  name_size = len(path.name.encode("utf-8"))
              except UnicodeEncodeError as error:
                  raise SystemExit("local release asset name is invalid") from error
              size = path.stat().st_size
              if (
                  not path.name
                  or name_size > MAX_ASSET_NAME_BYTES
                  or size < 0
                  or size > MAX_ASSET_BYTES
              ):
                  raise SystemExit("local release asset exceeds a safety limit")
              local_sizes[path.name] = size
              local_total += size
          if local_total > MAX_ASSET_TOTAL_BYTES:
              raise SystemExit("local release assets exceed the aggregate size limit")
          local = sorted(local_sizes)
          remote = []
          remote_assets = release.get("assets")
          if not isinstance(remote_assets, list) or len(remote_assets) > MAX_RELEASE_ASSETS:
              raise SystemExit("GitHub Release reported too many assets")
          remote_total = 0
          for asset in remote_assets:
              name = asset.get("name") if isinstance(asset, dict) else None
              size = asset.get("size") if isinstance(asset, dict) else None
              if (
                  not isinstance(name, str)
                  or not name
                  or len(name.encode("utf-8")) > MAX_ASSET_NAME_BYTES
                  or pathlib.PurePath(name).name != name
                  or type(size) is not int
                  or not 0 <= size <= MAX_ASSET_BYTES
              ):
                  raise SystemExit("GitHub Release reported a malformed asset name")
              remote.append(name)
              remote_total += size
              if name in local_sizes and size != local_sizes[name]:
                  raise SystemExit("GitHub Release asset size disagrees with candidate")
          if remote_total > MAX_ASSET_TOTAL_BYTES:
              raise SystemExit("GitHub Release assets exceed the aggregate size limit")
          if len(remote) != len(set(remote)):
              raise SystemExit("GitHub Release contains duplicate asset names")

          expected = set(local)
          actual = set(remote)
          extras = sorted(actual - expected)
          if extras:
              raise SystemExit(
                  "GitHub Release contains unexpected assets: " + ", ".join(extras)
              )
          pathlib.Path(expected_path).write_text("\n".join(local) + "\n")
          pathlib.Path(missing_path).write_text("\n".join(sorted(expected - actual)) + ("\n" if expected - actual else ""))
          pathlib.Path(common_path).write_text("\n".join(sorted(expected & actual)) + ("\n" if expected & actual else ""))
          pathlib.Path(draft_state_path).write_text(str(draft).lower() + "\n")
          PY

          # Compare every existing byte before performing a resumable upload.
          downloaded_existing=$(mktemp -d)
          while IFS= read -r asset; do
            [[ -n "$asset" ]] || continue
            gh release download "$RELEASE_TAG" \
              --dir "$downloaded_existing" \
              --pattern "$asset"
            if ! cmp --silent "$asset_dir/$asset" "$downloaded_existing/$asset"; then
              echo "GitHub Release asset conflicts with candidate bytes: $asset" >&2
              exit 1
            fi
          done < "$common_assets"

          if [[ -s "$missing_assets" ]]; then
            is_draft=$(<"$draft_state")
            if [[ "$is_draft" != true ]]; then
              echo "Public GitHub Release is missing assets and cannot be resumed safely" >&2
              exit 1
            fi
            while IFS= read -r asset; do
              [[ -n "$asset" ]] || continue
              gh release upload "$RELEASE_TAG" "$asset_dir/$asset"
            done < "$missing_assets"
          fi

          # Re-read after upload: concurrent extras, omissions, and metadata
          # changes must all fail closed.
          if ! capture_release_json "$release_id"; then
            echo "GitHub Release API failed during final draft verification" >&2
            exit 1
          fi
          python_clean - \
            "$RELEASE_TAG" \
            "$notes_file" \
            "$release_json_file" \
            "$expected_assets" \
            "$draft_state" <<'PY'
          import json
          import math
          import pathlib
          import sys

          (
              release_tag,
              notes_path,
              release_json_path,
              expected_path,
              draft_state_path,
          ) = sys.argv[1:]
          MAX_RELEASE_JSON_BYTES = 32 * 1024 * 1024
          MAX_NOTES_BYTES = 1024 * 1024
          MAX_EXPECTED_BYTES = 32 * 1024
          MAX_RELEASE_ASSETS = 16
          MAX_ASSET_NAME_BYTES = 1024
          MAX_ASSET_BYTES = 128 * 1024 * 1024
          MAX_ASSET_TOTAL_BYTES = 256 * 1024 * 1024
          READ_CHUNK_BYTES = 64 * 1024

          def read_text_bounded(path_text, limit, label):
              path = pathlib.Path(path_text)
              advertised = path.stat().st_size
              if not 0 <= advertised <= limit:
                  raise SystemExit(f"{label} exceeds the byte limit")
              chunks = []
              total = 0
              with path.open("rb") as stream:
                  while total < limit:
                      requested = min(READ_CHUNK_BYTES, limit - total)
                      chunk = stream.read(requested)
                      if not chunk:
                          break
                      if len(chunk) > requested:
                          raise SystemExit(f"{label} exceeded a bounded read")
                      chunks.append(chunk)
                      total += len(chunk)
                  if stream.read(1):
                      raise SystemExit(f"{label} exceeds the byte limit")
              if total != advertised:
                  raise SystemExit(f"{label} changed while being read")
              try:
                  return b"".join(chunks).decode("utf-8", "strict")
              except UnicodeDecodeError as error:
                  raise SystemExit(f"{label} is not UTF-8") from error

          def unique_object(pairs):
              result = {}
              for key, value in pairs:
                  if key in result:
                      raise ValueError("duplicate JSON object key")
                  result[key] = value
              return result

          def parse_integer(value):
              if len(value.lstrip("-")) > 20:
                  raise ValueError("oversized JSON integer")
              return int(value)

          def parse_float(value):
              if len(value) > 64:
                  raise ValueError("oversized JSON float")
              result = float(value)
              if not math.isfinite(result):
                  raise ValueError("non-finite JSON float")
              return result

          def reject_constant(_value):
              raise ValueError("non-finite JSON constant")

          try:
              release = json.loads(
                  read_text_bounded(
                      release_json_path, MAX_RELEASE_JSON_BYTES, "GitHub Release response"
                  ),
                  object_pairs_hook=unique_object,
                  parse_float=parse_float,
                  parse_int=parse_integer,
                  parse_constant=reject_constant,
              )
          except ValueError as error:
              raise SystemExit("GitHub Release response is malformed") from error
          if not isinstance(release, dict):
              raise SystemExit("GitHub Release response is malformed")
          expected_title = f"boundver {release_tag.removeprefix('v')}"
          expected_notes = read_text_bounded(
              notes_path, MAX_NOTES_BYTES, "release notes"
          )
          def normalized_notes(value):
              return value.replace("\r\n", "\n").replace("\r", "\n").rstrip("\n")

          if release.get("name") != expected_title:
              raise SystemExit("GitHub Release title changed during reconciliation")
          body = release.get("body")
          if not isinstance(body, str) or normalized_notes(body) != normalized_notes(expected_notes):
              raise SystemExit("GitHub Release notes changed during reconciliation")
          if release.get("tag_name") != release_tag:
              raise SystemExit("GitHub Release tag changed during reconciliation")
          draft = release.get("draft")
          if type(draft) is not bool:
              raise SystemExit("GitHub Release draft state is malformed")
          if release.get("prerelease") is not False:
              raise SystemExit("GitHub Release became a prerelease during reconciliation")
          if not draft and (
              release.get("immutable") is not True
              or not isinstance(release.get("published_at"), str)
              or not release["published_at"]
          ):
              raise SystemExit(
                  "Public GitHub Release is not immutable or lacks a publication timestamp"
              )
          expected_lines = read_text_bounded(
              expected_path, MAX_EXPECTED_BYTES, "expected release assets"
          ).splitlines()
          if len(expected_lines) > MAX_RELEASE_ASSETS or len(expected_lines) != len(set(expected_lines)):
              raise SystemExit("expected release asset set is malformed")
          expected = set(expected_lines)
          names = []
          remote_assets = release.get("assets")
          if not isinstance(remote_assets, list) or len(remote_assets) > MAX_RELEASE_ASSETS:
              raise SystemExit("GitHub Release reported too many assets")
          remote_total = 0
          for asset in remote_assets:
              name = asset.get("name") if isinstance(asset, dict) else None
              size = asset.get("size") if isinstance(asset, dict) else None
              if (
                  not isinstance(name, str)
                  or not name
                  or len(name.encode("utf-8")) > MAX_ASSET_NAME_BYTES
                  or pathlib.PurePath(name).name != name
                  or type(size) is not int
                  or not 0 <= size <= MAX_ASSET_BYTES
              ):
                  raise SystemExit("GitHub Release reported a malformed asset")
              names.append(name)
              remote_total += size
          if remote_total > MAX_ASSET_TOTAL_BYTES:
              raise SystemExit("GitHub Release assets exceed the aggregate size limit")
          if len(names) != len(set(names)):
              raise SystemExit("GitHub Release contains duplicate asset names")
          actual = set(names)
          if actual != expected:
              missing = sorted(expected - actual)
              extra = sorted(actual - expected)
              raise SystemExit(
                  f"GitHub Release asset set disagrees; missing={missing}, extra={extra}"
              )
          pathlib.Path(draft_state_path).write_text(str(draft).lower() + "\n")
          PY

          remote_assets=$(mktemp -d)
          gh release download "$RELEASE_TAG" --dir "$remote_assets"
          diff -u \
            <(cd "$asset_dir" && sha256sum * | LC_ALL=C sort) \
            <(cd "$remote_assets" && sha256sum * | LC_ALL=C sort)
          is_draft=$(<"$draft_state")
          if [[ "$is_draft" == true ]]; then
            echo "Draft is complete. Publish it with the Marketplace checkbox, then approve the marketplace environment."
          elif [[ "$is_draft" == false ]]; then
            echo "Public immutable GitHub Release exactly matches the retained candidate."
          else
            echo "GitHub Release draft state is malformed" >&2
            exit 1
          fi

  verify-marketplace:
    name: Verify immutable Release and Marketplace publication
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [verify-release, verify-testpypi, prepare-release-draft]
    environment: marketplace
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout the released commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ inputs.release_sha }}

      - name: Checkout the reviewed release-control commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          path: .release-control

      - name: Download exact distribution and release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.verify-release.outputs.python-dist-artifact-id }}
          path: dist
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.verify-release.outputs.source-run-id }}
          merge-multiple: true

      - name: Download exact GitHub Release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.verify-release.outputs.release-assets-artifact-id }}
          path: release-assets
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.verify-release.outputs.source-run-id }}
          merge-multiple: true

      - name: Reverify TestPyPI candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 -I scripts/verify_testpypi_release.py verify \
            --dist dist \
            --project boundver \
            --version "${RELEASE_TAG#v}" \
            --attempts 1 \
            --delay-seconds 0

      - name: Require public immutable Release and Marketplace version
        shell: bash
        run: |
          set -euo pipefail
          version=${RELEASE_TAG#v}
          verification_alias="$COMPATIBILITY_ALIAS"
          if [[ "$verification_alias" == none ]]; then
            # The marketplace phase does not resolve the alias, but the surface
            # verifier still validates the release-line-shaped argument.
            verification_alias="v${version%.*}"
          fi
          python3 -I .release-control/scripts/release_changelog.py \
            --tag "$RELEASE_TAG" \
            --output "$RUNNER_TEMP/release-notes.md"
          python3 -I .release-control/scripts/verify_release_surfaces.py \
            --tag "$RELEASE_TAG" \
            --sha "$RELEASE_SHA" \
            --alias "$verification_alias" \
            --dist-dir dist \
            --release-notes "$RUNNER_TEMP/release-notes.md" \
            --release-assets-dir release-assets \
            --phase marketplace \
            --attempts 18 \
            --delay-seconds 10

  pypi-preflight:
    name: Reject conflicting production PyPI state
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [verify-release, verify-marketplace]
    permissions:
      actions: read
      contents: read
    outputs:
      upload-required: ${{ steps.preflight.outputs.upload-required }}
    steps:
      - name: Checkout the released commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.release_sha }}

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Download exact Python distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.verify-release.outputs.python-dist-artifact-id }}
          path: dist
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.verify-release.outputs.source-run-id }}
          merge-multiple: true

      - name: Accept only a missing, exact, or exact-partial PyPI release
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          python3 -I scripts/verify_testpypi_release.py preflight \
            --dist dist \
            --project boundver \
            --version "${RELEASE_TAG#v}" \
            --api-base https://pypi.org/pypi \
            --download-origin https://files.pythonhosted.org \
            --github-output "$GITHUB_OUTPUT"

  publish-pypi:
    name: Promote verified candidate to PyPI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [verify-release, verify-marketplace, pypi-preflight]
    environment: pypi
    permissions:
      actions: read
      id-token: write
    steps:
      - name: Download the exact immutable candidate by artifact ID
        if: needs.pypi-preflight.outputs.upload-required == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.verify-release.outputs.python-dist-artifact-id }}
          path: dist
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.verify-release.outputs.source-run-id }}
          merge-multiple: true

      # A failed upload may already have made one filename immutable on PyPI.
      # Re-running failed jobs therefore republishes the same complete, bound
      # artifact with duplicate tolerance; verify-pypi then requires every
      # public byte to match that immutable candidate.
      - name: Upload the exact candidate to PyPI with retry-safe duplicates
        if: needs.pypi-preflight.outputs.upload-required == 'true'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist
          skip-existing: true
          attestations: true

  verify-pypi:
    name: Verify PyPI bytes, installation, and provenance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [verify-release, publish-pypi]
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout the released commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.release_sha }}

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Download exact Python distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.verify-release.outputs.python-dist-artifact-id }}
          path: dist
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.verify-release.outputs.source-run-id }}
          merge-multiple: true

      - name: Verify exact PyPI files and obtain hash-pinned URLs
        id: verify-pypi
        shell: bash
        run: |
          set -euo pipefail
          python3 -I scripts/verify_testpypi_release.py verify \
            --dist dist \
            --project boundver \
            --version "${RELEASE_TAG#v}" \
            --api-base https://pypi.org/pypi \
            --download-origin https://files.pythonhosted.org \
            --attempts 18 \
            --delay-seconds 10 \
            --github-output "$GITHUB_OUTPUT"

      - name: Install only the verified PyPI wheel
        shell: bash
        env:
          EXPECTED_VERSION: ${{ inputs.release_tag }}
          PYPI_WHEEL_URL: ${{ steps.verify-pypi.outputs.wheel-url }}
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
          PIP_NO_INDEX: "1"
        run: |
          set -euo pipefail
          case "$PYPI_WHEEL_URL" in
            https://files.pythonhosted.org/*#sha256=*) ;;
            *) echo "Verifier returned a non-PyPI wheel URL" >&2; exit 1 ;;
          esac
          install_root=$(mktemp -d)
          python3 -I -m venv "$install_root/venv"
          "$install_root/venv/bin/python" -I -m pip --isolated install \
            --no-index --no-deps "$PYPI_WHEEL_URL"
          actual=$(cd "$RUNNER_TEMP" && \
            "$install_root/venv/bin/python" -I -c \
              'import importlib.metadata; print(importlib.metadata.version("boundver"))')
          test "v$actual" = "$EXPECTED_VERSION"
          cd "$RUNNER_TEMP"
          "$install_root/venv/bin/python" -I -m boundver --version

      - name: Cryptographically verify PyPI trusted-publisher provenance
        shell: bash
        env:
          PYPI_WHEEL_URL: ${{ steps.verify-pypi.outputs.wheel-url }}
          PYPI_SDIST_URL: ${{ steps.verify-pypi.outputs.sdist-url }}
        run: |
          set -euo pipefail
          python3 -I scripts/install_locked_tools.py release
          wheel_url=${PYPI_WHEEL_URL%%#*}
          sdist_url=${PYPI_SDIST_URL%%#*}
          pypi-attestations verify pypi \
            --repository https://github.com/yzm1/boundver "$wheel_url"
          pypi-attestations verify pypi \
            --repository https://github.com/yzm1/boundver "$sdist_url"

  publish-container:
    name: Publish and verify the release container
    needs: [verify-release, verify-pypi]
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
      packages: write
    uses: ./.github/workflows/publish-container.yml
    with:
      release_tag: ${{ inputs.release_tag }}
      release_sha: ${{ inputs.release_sha }}
      reuse_retained_artifact: ${{ needs.verify-release.outputs.container-artifact-id != '' }}
      retained_artifact_name: ${{ needs.verify-release.outputs.container-artifact-name }}

  advance-compatibility-alias:
    name: Apply the explicit Action alias decision
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [verify-pypi, publish-container]
    # This approval is the maintainer handoff: advance the alias locally with
    # scripts/publish_release.py before approving the waiting job. GitHub's
    # built-in token cannot write a ref that makes workflow changes reachable.
    environment: action-alias
    permissions:
      actions: write
      contents: read
    steps:
      - name: Checkout the released commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ inputs.release_sha }}

      - name: Checkout the reviewed release-control commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          path: .release-control

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Record the explicit no-alias decision
        if: inputs.compatibility_alias == 'none'
        shell: bash
        run: echo "No compatibility alias was approved for $RELEASE_TAG."

      - name: Dispatch exact-tag alias handoff verification
        if: inputs.compatibility_alias != 'none'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          clean_python_cwd=$(mktemp -d)
          cd "$clean_python_cwd"
          python3 -I \
            "$GITHUB_WORKSPACE/.release-control/scripts/release_alias.py" dispatch \
            --repo-root "$GITHUB_WORKSPACE" \
            --repository "$GITHUB_REPOSITORY" \
            --tag "$RELEASE_TAG" \
            --sha "$RELEASE_SHA" \
            --alias "$COMPATIBILITY_ALIAS" \
            --publication-run-id "$GITHUB_RUN_ID" \
            --publication-attempt "$GITHUB_RUN_ATTEMPT" \
            --publication-ref "$GITHUB_REF_NAME" \
            --publication-sha "$GITHUB_SHA"

  verify-public-surfaces:
    name: Verify every public release surface
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [verify-release, advance-compatibility-alias]
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout the released commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.release_sha }}

      - name: Checkout the reviewed release-control commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          path: .release-control

      - name: Download exact Python distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.verify-release.outputs.python-dist-artifact-id }}
          path: dist
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.verify-release.outputs.source-run-id }}
          merge-multiple: true

      - name: Download exact GitHub Release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.verify-release.outputs.release-assets-artifact-id }}
          path: release-assets
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.verify-release.outputs.source-run-id }}
          merge-multiple: true

      - name: Compare all public services with the exact candidate
        shell: bash
        run: |
          set -euo pipefail
          version=${RELEASE_TAG#v}
          python3 -I .release-control/scripts/release_changelog.py \
            --tag "$RELEASE_TAG" \
            --output "$RUNNER_TEMP/release-notes.md"
          verification_alias_args=()
          if [[ "$COMPATIBILITY_ALIAS" == none ]]; then
            # Alias-free promotion still verifies both registries and every
            # immutable surface; only alias resolution is intentionally skipped.
            verification_alias="v${version%.*}"
            verification_alias_args=(--skip-alias)
          else
            verification_alias="$COMPATIBILITY_ALIAS"
          fi
          python3 -I .release-control/scripts/verify_release_surfaces.py \
              --tag "$RELEASE_TAG" \
              --sha "$RELEASE_SHA" \
              --alias "$verification_alias" \
              --dist-dir dist \
              --release-notes "$RUNNER_TEMP/release-notes.md" \
              --release-assets-dir release-assets \
              --phase complete \
              "${verification_alias_args[@]}" \
              --attempts 18 \
              --delay-seconds 10
