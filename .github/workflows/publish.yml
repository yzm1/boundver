name: Publish to PyPI

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing immutable version tag to publish.
        required: true
        type: string
      release_sha:
        description: Exact commit SHA referenced by the version tag.
        required: true
        type: string

permissions: {}

env:
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
  RELEASE_SHA: ${{ inputs.release_sha || github.sha }}

jobs:
  verify-release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_sha || github.sha }}

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Validate tag and package version
        shell: bash
        run: |
          python - "$RELEASE_TAG" "$RELEASE_SHA" <<'PY'
          import pathlib
          import re
          import subprocess
          import sys
          import tomllib

          expected = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"]
          actual = sys.argv[1]
          release_sha = sys.argv[2]
          if re.fullmatch(r"[0-9a-f]{40}", release_sha) is None:
              raise SystemExit(f"invalid release SHA: {release_sha!r}")
          if actual != f"v{expected}":
              raise SystemExit(f"tag {actual!r} does not match package version v{expected}")
          head_sha = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          if head_sha != release_sha:
              raise SystemExit(f"checked-out commit {head_sha} does not match {release_sha}")
          remote_tag = subprocess.check_output(
              ["git", "ls-remote", "origin", f"refs/tags/{actual}"], text=True
          ).split()
          if not remote_tag or remote_tag[0] != release_sha:
              raise SystemExit(f"tag {actual!r} does not resolve to {release_sha}")
          PY

      - name: Test and build
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]' twine
          pytest -q
          python -m build
          python -m twine check dist/*
          python -m zipfile --list dist/*.whl
          tar -tzf dist/*.tar.gz

      - name: Upload verified distributions
        uses: actions/upload-artifact@v4
        with:
          name: release-dist
          path: dist/

  publish:
    runs-on: ubuntu-latest
    needs: verify-release
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download verified distributions
        uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  release:
    runs-on: ubuntu-latest
    needs: publish
    permissions:
      contents: write
    steps:
      - name: Checkout the released commit
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_sha || github.sha }}

      - name: Download verified distributions
        uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: dist

      - name: Advance the stable v0 tag
        shell: bash
        run: |
          set -euo pipefail
          git tag --force v0 "$RELEASE_SHA"
          git push origin refs/tags/v0 --force
          remote_sha=$(git ls-remote origin refs/tags/v0 | awk '{print $1}')
          test "$remote_sha" = "$RELEASE_SHA"

      - name: Create the GitHub Release from verified artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" dist/* \
              --verify-tag \
              --title "boundver ${RELEASE_TAG#v}" \
              --generate-notes
          fi
