name: PR lite checks

on:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - "boundary.config.schema.json"
      - ".github/workflows/pr-lite.yml"

jobs:
  lite:
    runs-on: ubuntu-latest
    concurrency:
      group: pr-lite-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Test
        run: pytest -q
