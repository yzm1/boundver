# Temporary, fail-closed exceptions for the pinned Debian 13.7 runtime image.
#
# Trivy reported no fixed Debian package for these IDs on 2026-09-15 after the
# image upgraded every inherited package from the immutable 2026-09-14
# snapshot. The container runs as an unprivileged user, strips every set-ID
# bit, removes its Python build/package managers, and boundver performs
# local-only Git object reads with lazy fetching disabled. A second CI scan
# ignores no fixable finding, so an available vendor fix blocks immediately
# even before these narrow exceptions expire.
vulnerabilities:
  - id: CVE-2025-69720
    purls:
      - pkg:deb/debian/libncursesw6
      - pkg:deb/debian/libtinfo6
      - pkg:deb/debian/ncurses-base
      - pkg:deb/debian/ncurses-bin
    expired_at: 2026-09-29
    statement: Inherited ncurses libraries are not used by the noninteractive boundver entrypoint; no Debian fix is available.
  - id: CVE-2026-12064
    purls:
      - pkg:deb/debian/libcurl3t64-gnutls
    expired_at: 2026-09-29
    statement: Git network transports are outside boundver's local-only runtime path; no Debian libcurl fix is available.
  - id: CVE-2026-16742
    purls:
      - pkg:deb/debian/libsystemd0
      - pkg:deb/debian/libudev1
    expired_at: 2026-09-29
    statement: The affected systemd-homed package and executable are absent from the non-root image; no Debian trixie fix is available.
  - id: CVE-2026-54369
    purls:
      - pkg:deb/debian/libacl1
    expired_at: 2026-09-29
    statement: The runtime is non-root with set-ID helpers stripped; no Debian libacl fix is available.
  - id: CVE-2026-66046
    purls:
      - pkg:deb/debian/libexpat1
    expired_at: 2026-09-29
    statement: Boundver and its local Git plumbing do not parse attacker-controlled XML; Debian classifies this as a postponed minor issue and provides no trixie fix.
  - id: CVE-2026-76642
    purls:
      - pkg:deb/debian/bsdutils
      - pkg:deb/debian/libblkid1
      - pkg:deb/debian/liblastlog2-2
      - pkg:deb/debian/libmount1
      - pkg:deb/debian/libsmartcols1
      - pkg:deb/debian/libuuid1
      - pkg:deb/debian/login
      - pkg:deb/debian/mount
      - pkg:deb/debian/util-linux
    expired_at: 2026-09-29
    statement: The affected privileged mount post-hook path is unused; the runtime is non-root with every set-ID bit stripped, and Debian trixie has no fix.
  - id: CVE-2026-76956
    purls:
      - pkg:deb/debian/libexpat1
    expired_at: 2026-09-29
