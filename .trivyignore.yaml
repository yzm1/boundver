# Temporary, fail-closed exceptions for the pinned Debian 13.6 runtime image.
#
# Trivy reported no fixed Debian package for these IDs on 2026-09-01. The
# container runs as an unprivileged user, strips every set-ID bit, removes its
# Python build/package managers, and boundver performs local-only Git object
# reads with lazy fetching disabled. A second CI scan ignores no fixable
# finding, so an available vendor fix blocks immediately even before these
# narrow exceptions expire.
vulnerabilities:
  - id: CVE-2025-69720
    purls:
      - pkg:deb/debian/libncursesw6
      - pkg:deb/debian/libtinfo6
      - pkg:deb/debian/ncurses-base
      - pkg:deb/debian/ncurses-bin
    expired_at: 2026-09-15
    statement: Inherited ncurses libraries are not used by the noninteractive boundver entrypoint; no Debian fix is available.
  - id: CVE-2026-11822
    purls:
      - pkg:deb/debian/libsqlite3-0
    expired_at: 2026-09-15
    statement: Inherited SQLite library is not used by boundver; no Debian fix is available.
  - id: CVE-2026-11824
    purls:
      - pkg:deb/debian/libsqlite3-0
    expired_at: 2026-09-15
    statement: Inherited SQLite library is not used by boundver; no Debian fix is available.
  - id: CVE-2026-12064
    purls:
      - pkg:deb/debian/libcurl3t64-gnutls
    expired_at: 2026-09-15
    statement: Git network transports are outside boundver's local-only runtime path; no Debian libcurl fix is available.
  - id: CVE-2026-13221
