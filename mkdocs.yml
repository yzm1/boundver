site_name: boundver
site_description: A Git-aware lockfile and CI check for contracts shared across components.
site_url: https://yzm1.github.io/boundver/
repo_url: https://github.com/yzm1/boundver
repo_name: yzm1/boundver
edit_uri: edit/main/docs/
copyright: Copyright boundver contributors. MIT licensed.

docs_dir: docs
site_dir: site
strict: true
theme:
  name: material
  custom_dir: docs/overrides
  logo: assets/logo-small.svg
  favicon: assets/favicon.svg
  font: false
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.code.copy
    - navigation.instant
    - navigation.path
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - search.highlight
    - search.suggest
    - toc.follow

nav:
  - Home: index.md
  - Start:
      - Executive summary: executive-summary.md
      - One-minute demo: demo.md
      - Getting started: getting-started.md
      - Gradual adoption: gradual-adoption.md
      - Examples: examples.md
  - Guides:
      - Range-review case study: case-study-range-review.md
      - CI cookbook: ci-cookbook.md
      - Migration and ratcheting: migration-and-ratcheting.md
      - Lockfile merges: LOCKFILE_MERGE.md
      - Distribution: distribution.md
      - Troubleshooting: troubleshooting.md
  - Reference:
      - CLI and configuration: reference.md
      - Glossary: glossary.md
      - Normative specification: specification.md
      - Hashing contract: hashing-contract.md
      - Performance contract: performance.md
      - Public and custom providers: public-vs-custom-providers.md
  - Project:
      - Why boundver?: WHY_BOUNDVER.md
      - Comparison and integrations: comparison.md
      - Privacy and telemetry: privacy.md
      - Security model: security-model.md
      - Support and compatibility: support.md
      - Documentation style: documentation-style.md
      - Release process: RELEASING.md
      - Design and assurance:
          - Semantic provider RFC: design/semantic-provider-rfc.md
          - Semantic provider threat model: design/semantic-provider-threat-model.md

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.snippets:
      base_path:
        - .
      restrict_base_path: true
      url_download: false
      check_paths: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/yzm1/boundver
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/boundver/
    - icon: fontawesome/solid/comments
      link: https://github.com/yzm1/boundver/discussions/100
      name: Using boundver? Tell us
