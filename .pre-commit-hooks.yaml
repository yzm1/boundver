- id: boundver-verify
  name: boundver verify staged lock
  language: python
  entry: boundver
  args: [verify, --source, index, --facets, exact]
  pass_filenames: false
  description: >
    Verify that boundary.lock.json is up to date with the staged snapshot.
    Fails with the documented facet-specific exit code when fingerprints drift;
    blocks the commit until you run
    `boundver generate --source index` and stage the updated lockfile.
  additional_dependencies: ["jsonschema==4.25.1", "PyYAML==6.0.3"]
  always_run: true
  stages: [pre-commit]

- id: boundver-verify-push
  name: boundver verify committed lock
  language: python
  entry: boundver
  args: [verify, --source, head, --facets, exact]
  pass_filenames: false
  description: >
    Verify that boundary.lock.json is up to date with the committed snapshot
    before pushing it.
  additional_dependencies: ["jsonschema==4.25.1", "PyYAML==6.0.3"]
  always_run: true
  stages: [pre-push]

- id: boundver-generate
  name: boundver generate
  language: python
  entry: boundver
  args: [generate, --source, index]
  pass_filenames: false
  description: >
    Regenerate boundary.lock.json from the staged snapshot. Use this hook on the
    pre-commit stage to auto-update the lockfile before committing.
  additional_dependencies: ["jsonschema==4.25.1", "PyYAML==6.0.3"]
  always_run: true
  stages: [pre-commit]
